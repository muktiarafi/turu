name: Release

# Pushing a tag such as `v0.1.0-alpha.1` builds Turu for every platform (Linux, Windows, macOS and
# Android) and Turu Mas (Android, on Adobe AIR), and publishes a GitHub release with the packages.
# A release or a beta (`v0.4.0-beta.1`) becomes the Latest release: GitHub's Latest can't be a
# pre-release, and betas are what users run. Another tag with a `-` (alpha, rc) makes a
# pre-release. Turu's updater goes by the version, not this flag: a beta is a pre-release to it
# either way (`turu_bot::updates::newest`).
# Running it by hand (Actions > Release > Run workflow) only builds; the packages are kept as
# workflow artifacts.
#
# Nightly: every night (when main has new commits), or by hand with "Publish as the nightly
# release" ticked, it builds as `<next version>-nightly.<date>` (0.4.0-nightly.20261118) and
# replaces the one `nightly` release: a pre-release, never "Latest", for testers who download it
# by hand. Updates never reach or leave it: its tag isn't a version, so no client's updater takes
# it (shipped ones included), and a nightly build doesn't check (`turu_bot::updates::is_nightly`).
# One rolling release, not one a night: the updater reads one page of GitHub's release list
# (30), which a release a night would fill.
on:
  push:
    tags:
      - "v*"
  schedule:
    # 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish as the nightly release (replaces the current one)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The feature set Mugetsu releases with (see CLAUDE.md). Font lookups are guarded by
  # `cfg(unix)`, so the same list builds on Windows.
  FEATURES: software_video,external_video,lzma,jpegxr,fontconfig-dlopen

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      # A nightly build (published as the `nightly` release), and its `CFG_RELEASE_CHANNEL`.
      nightly: ${{ steps.version.outputs.nightly }}
      channel: ${{ steps.version.outputs.channel }}
      # Nothing to build: a scheduled run with no commit since the last nightly, or in a fork.
      skip: ${{ steps.version.outputs.skip }}
    steps:
      # The root Cargo.toml: a nightly's version starts with the release it leads to.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: |
          nightly=false
          skip=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$NIGHTLY" == true ]]; then
            nightly=true
            base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            # The date as one number: no leading zero (semver), no `+` (GitHub renames assets
            # with one).
            version="${base%%-*}-nightly.$(date -u +%Y%m%d)"
            if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
              last=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
              if [[ "$GITHUB_REPOSITORY" != muktiarafi/turu ]]; then
                echo "Not muktiarafi/turu: no nightly"
                skip=true
              elif [[ "$last" == "$GITHUB_SHA" ]]; then
                echo "The nightly release is already at $GITHUB_SHA: nothing to build"
                skip=true
              fi
            fi
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          # GitHub's pre-release flag: betas aren't, so they can be Latest (see the top).
          prerelease=false
          [[ "$version" == *-* && "$version" != *-beta* ]] && prerelease=true
          channel=stable
          [[ "$nightly" == true ]] && channel=nightly
          echo "version=$version" | tee -a "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" | tee -a "$GITHUB_OUTPUT"
          echo "nightly=$nightly" | tee -a "$GITHUB_OUTPUT"
          echo "channel=$channel" | tee -a "$GITHUB_OUTPUT"
          echo "skip=$skip" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test engine and scripts
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      # scripts/ is the turu-scripts submodule: the engine tests load its scripts, and they are
      # type-checked against this commit's bot/js/turu.ts. The packages don't ship it (Search
      # Scripts downloads the scripts), so the build jobs check out only ruffle/.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Test the bot engine
        run: cargo test --locked -p turu_bot

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Type-check scripts
        working-directory: scripts
        run: npx -y -p typescript@5.9.3 tsc --noEmit -p .

  build:
    name: Build ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          # The two macOS builds are joined into one universal app by `macos-app`.
          - name: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-26
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # ruffle/ (ruffle-aqw) holds the Flash player's crates; scripts/ isn't needed to build.
      - run: git submodule update --init --depth 1 ruffle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Ruffle compiles its Flash classes (playerglobal) with asc.jar.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      # Line tables only (file and line, for Sentry to read crash reports' frames), kept out of
      # the shipped binary: a PDB on Windows, a dSYM on macOS, stripped on Linux after the upload.
      - name: Build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            export CARGO_PROFILE_DIST_SPLIT_DEBUGINFO=packed
          fi
          cargo build --locked --package turu --profile dist --target ${{ matrix.target }} \
            --no-default-features --features "$FEATURES"
        env:
          TURU_VERSION: ${{ needs.version.outputs.version }}
          CFG_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          RUSTFLAGS: ${{ matrix.rustflags }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CARGO_PROFILE_DIST_DEBUG: line-tables-only
          # Crash reports (`app/src/crash_uploads.rs`): without it the build has none.
          TURU_SENTRY_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

      # Sentry reads Turu's frames in crash reports with these. Skipped without SENTRY_AUTH_TOKEN;
      # SENTRY_ORG and SENTRY_DESKTOP_PROJECT are repository variables.
      - name: Upload symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_DESKTOP_PROJECT }}
        run: |
          bin=target/${{ matrix.target }}/dist
          case "$RUNNER_OS" in
            Windows) files=("$bin/turu.exe" "$bin/turu.pdb") ;;
            macOS) files=("$bin/turu" "$bin/turu.dSYM") ;;
            *) files=("$bin/turu") ;;
          esac
          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_PROJECT" ]]; then
            echo "No SENTRY_AUTH_TOKEN secret or SENTRY_DESKTOP_PROJECT variable: symbols not uploaded"
          else
            npx -y @sentry/cli@3.8.1 debug-files upload "${files[@]}"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            strip --strip-debug "$bin/turu"
          fi

      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/dist
          .github/scripts/turu-package-common.sh package
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp "$bin/turu.exe" package/
            (cd package && 7z a "../turu-$VERSION-${{ matrix.name }}.zip" .)
          else
            cp "$bin/turu" package/
            chmod +x package/turu
            # The launcher entry and its icon: ./install-desktop.sh adds Turu to the app menu.
            cp .github/linux/turu.desktop .github/linux/turu.png .github/linux/turu-512.png \
              .github/linux/install-desktop.sh package/
            tar -czf "turu-$VERSION-${{ matrix.name }}.tar.gz" -C package .
          fi

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS'
        with:
          name: turu-${{ matrix.name }}
          path: turu-${{ needs.version.outputs.version }}-${{ matrix.name }}.*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/dist/turu
          if-no-files-found: error

  macos-app:
    name: Build macos-universal
    needs: [version, build]
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bin-macos-aarch64
          path: bin/aarch64

      - uses: actions/download-artifact@v8
        with:
          name: bin-macos-x86_64
          path: bin/x86_64

      - name: Make the app bundle
        run: |
          app=package/Turu.app
          .github/scripts/turu-package-common.sh package
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/turu" bin/aarch64/turu bin/x86_64/turu
          chmod +x "$app/Contents/MacOS/turu"

          # iconutil wants a folder named *.iconset.
          cp -R app/assets/Assets.xcassets/RuffleMacIcon.iconset Turu.iconset
          iconutil -c icns -o "$app/Contents/Resources/Turu.icns" Turu.iconset

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>Turu</string>
              <key>CFBundleExecutable</key>
              <string>turu</string>
              <key>CFBundleIconFile</key>
              <string>Turu</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.muktiarafi.turu</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Turu</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION%%-*}</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>MacOSX</string>
              </array>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.games</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"

          # Ad-hoc signature: enough for macOS to run it; not notarized (see README.txt).
          codesign --force --sign - --timestamp=none "$app"

          # --norsrc: no AppleDouble ("._") files in the zip.
          ditto -c -k --norsrc package "turu-$VERSION-macos-universal.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: turu-macos-universal
          path: turu-${{ needs.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error

  android:
    name: Build android-arm64
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7

      # rustls-platform-verifier's Kotlin half (HTTPS checks against Android's trust store).
      - run: git submodule update --init --depth 1 ruffle android/vendor/rustls-platform-verifier

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Ruffle's playerglobal and Gradle (AGP 9 wants JDK 17 or newer).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64

      - name: Install the Android SDK parts, cargo-ndk and libclang
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # 37.1 for the app (Compose 1.13), 36 for the modules it includes.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          cargo install cargo-ndk --version 4.1.2 --locked
          # rquickjs makes its QuickJS bindings with bindgen, which loads libclang.
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          libclang=$(find /usr/lib/llvm-* -name 'libclang.so*' | sort -V | tail -1)
          echo "LIBCLANG_PATH=$(dirname "$libclang")" | tee -a "$GITHUB_ENV"
          printf 'sdk.dir=%s\nndkAbis=arm64-v8a\n' "$ANDROID_HOME" > android/local.properties

      # The release keystore, from the repository's secrets (docs/ANDROID.md). A tag or a nightly
      # needs it, so every published APK has the same signature and installs over the others; a
      # run by hand without it is signed with a debug key.
      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NIGHTLY: ${{ needs.version.outputs.nightly }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag || "$NIGHTLY" == true ]]; then
              echo "::error::The ANDROID_KEYSTORE secret is missing; a release APK must be signed with it"
              exit 1
            fi
            echo "::warning::No ANDROID_KEYSTORE secret: the APK is signed with a debug key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/turu.jks"
          echo "TURU_KEYSTORE=$RUNNER_TEMP/turu.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease "-PturuVersion=$VERSION"
        env:
          TURU_VERSION: ${{ needs.version.outputs.version }}
          CFG_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          TURU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TURU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TURU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Crash reports (docs/ANDROID.md, "Crash reports"): without it the APK has none.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Package
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "turu-$VERSION-android-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "turu-$VERSION-android-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: turu-android-arm64
          path: turu-${{ needs.version.outputs.version }}-android-arm64.apk
          if-no-files-found: error

      # Sentry reads Turu's frames in native crash reports with the library's symbols, and puts
      # back the Kotlin frames R8 inlined with its mapping, under the UUID the build wrote into
      # the APK (`sentryProguardUuid` in app/build.gradle.kts; sentry-cli 3 still takes `--uuid`,
      # though its help no longer lists it). Skipped without SENTRY_AUTH_TOKEN (an organization
      # auth token); SENTRY_ORG and SENTRY_PROJECT are repository variables.
      - name: Upload symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" ]]; then
            echo "No SENTRY_AUTH_TOKEN secret: symbols not uploaded"
            exit 0
          fi
          npx -y @sentry/cli@3.8.1 debug-files upload android/app/src/main/jniLibs/arm64-v8a/libturu_android.so
          mapping=android/app/build/outputs/mapping/release
          npx -y @sentry/cli@3.8.1 upload-proguard --require-one --uuid "$(cat "$mapping/sentry-uuid.txt")" "$mapping/mapping.txt"

      # The library with its symbols (the APK's is stripped), to read a crash report's
      # backtrace: `llvm-symbolizer --obj=libturu_android.so <pc>` (docs/ANDROID.md). Not
      # published with the release (not `turu-*`).
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-android-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libturu_android.so
          if-no-files-found: error
          retention-days: 90

  # Turu Mas (docs/TURU_MAS.md): Turu's engine and windows over AQW's client in the Adobe AIR
  # runtime, its own Android app. Its APK is `turumas-*`, not `turu-*`: Turu's updater takes any
  # `turu-*-android-arm64.apk` as its own.
  turu-mas:
    name: Build Turu Mas android-arm64
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7

      # Cargo resolves the workspace's patches in ruffle/; rustls-platform-verifier's Kotlin half
      # goes into the extension's jar.
      - run: git submodule update --init --depth 1 ruffle android/vendor/rustls-platform-verifier

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # JDK 21 for Gradle (the extension's Kotlin); JDK 17 for AIR's tools (ADT packages with a
      # Gradle that doesn't run on newer ones): `AIR_JAVA_HOME` below.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Downloading the AIR SDK accepts its license (docs/TURU_MAS.md, "The AIR SDK's license"):
      # free tier, so the app starts with the SDK's splash screen. Sets AIR_HOME.
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.5.1.1"
          accept-license: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: turu-mas-android-arm64

      - name: Install the Android SDK parts, cargo-ndk and libclang
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          cargo install cargo-ndk --version 4.1.2 --locked
          sudo apt-get update
          sudo apt-get install -y libclang-dev libc++1
          libclang=$(find /usr/lib/llvm-* -name 'libclang.so*' | sort -V | tail -1)
          echo "LIBCLANG_PATH=$(dirname "$libclang")" | tee -a "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" | tee -a "$GITHUB_ENV"
          # The AIR SDK's Linux aapt (ADT runs it) loads the SDK's own lib64/libc++.so, which
          # lacks a symbol it needs ("undefined symbol: ...basic_ostringstream..."; 51.5.1.1).
          # Ubuntu's libc++ has it: a folder with just a `libc++.so` link to it, first on the
          # library path, serves aapt and nothing else (no other tool here asks for that name).
          mkdir -p "$RUNNER_TEMP/libcxx"
          ln -sf /usr/lib/x86_64-linux-gnu/libc++.so.1 "$RUNNER_TEMP/libcxx/libc++.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libcxx" | tee -a "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/libcxx" "$AIR_HOME/lib/android/bin/aapt" version

      # Turu Mas's own release key (PKCS#12), from the repository's secrets (docs/TURU_MAS.md). A
      # tag or a nightly needs it, so every published APK installs over the others; a run by hand
      # without it is signed with a development key made on the spot.
      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.MAS_KEYSTORE }}
          NIGHTLY: ${{ needs.version.outputs.nightly }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag || "$NIGHTLY" == true ]]; then
              echo "::error::The MAS_KEYSTORE secret is missing; a release APK must be signed with it"
              exit 1
            fi
            echo "::warning::No MAS_KEYSTORE secret: the APK is signed with a development key"
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/turu-mas.p12"
          echo "MAS_KEYSTORE=$RUNNER_TEMP/turu-mas.p12" >> "$GITHUB_ENV"

      # Line tables in the library (for Sentry to read crash reports' frames); the APK's copy is
      # stripped of them by air/ane/build.sh.
      - name: Build
        run: AIR_JAVA_HOME="$JAVA_HOME_17_X64" air/app/build.sh --no-install
        env:
          TURU_VERSION: ${{ needs.version.outputs.version }}
          CFG_RELEASE_CHANNEL: ${{ needs.version.outputs.channel }}
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          MAS_KEYSTORE_PASSWORD: ${{ secrets.MAS_KEYSTORE_PASSWORD }}
          # Crash reports (the extension's `CrashUploads.kt`, sentry-android: its Gradle build reads
          # this), to Turu's Android project: released as `turu-mas@<version>`, tagged
          # `client: air`. Without it the APK has none.
          TURU_MAS_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Package
        run: |
          cp target/air-app/TuruMas.apk "turumas-$VERSION-android-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "turumas-$VERSION-android-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "turumas-$VERSION-android-arm64.apk" | head -1

      # The artifact's name starts with `turu-` so the release job collects it.
      - uses: actions/upload-artifact@v7
        with:
          name: turu-mas-android-arm64
          path: turumas-${{ needs.version.outputs.version }}-android-arm64.apk
          if-no-files-found: error

      # To the Android project, as the crash reports. Skipped without SENTRY_AUTH_TOKEN.
      - name: Upload symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [[ -z "$SENTRY_AUTH_TOKEN" || -z "$SENTRY_PROJECT" ]]; then
            echo "No SENTRY_AUTH_TOKEN secret or SENTRY_PROJECT variable: symbols not uploaded"
            exit 0
          fi
          npx -y @sentry/cli@3.8.1 debug-files upload target/air-ane/jni/arm64-v8a/libturu_air.so

      - uses: actions/upload-artifact@v7
        with:
          name: symbols-turu-mas-android-arm64
          path: target/air-ane/jni/arm64-v8a/libturu_air.so
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, test, build, macos-app, android, turu-mas]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: turu-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          flags=(--title "Turu ${{ needs.version.outputs.version }}" --generate-notes)
          if [[ "${{ needs.version.outputs.prerelease }}" == true ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" dist/*

  # The nightly build replaces the `nightly` release (and its tag, moved to this commit).
  # Keep the tag `nightly`: shipped clients skip it only because it doesn't parse as a version
  # (`updates::tests::nightlies_neither_update_nor_are_offered`); a `v0.4.0-nightly...` tag would be
  # offered to every beta user.
  nightly:
    name: Publish nightly
    if: needs.version.outputs.nightly == 'true' && needs.version.outputs.skip != 'true'
    needs: [version, test, build, macos-app, android, turu-mas]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: turu-*
          merge-multiple: true
          path: dist

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          short="${GITHUB_SHA::7}"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          A development build of \`$GITHUB_REF_NAME\` at $GITHUB_SHA, for testing. It is replaced by the next nightly.

          - Nightly builds don't update themselves, and Turu's updater never offers a nightly: download the next one from this page by hand.
          - Back up your data folder first. A nightly may have bugs that a release fixes.
          - Android: the APKs carry the release signature. They install over Turu's earlier releases and ${VERSION%%-*}'s alphas, betas and release candidates; ${VERSION%%-*} and later install over them, but a later ${VERSION%%-*} pre-release doesn't (uninstall the nightly first).

          Changes: https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_SHA
          NOTES
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          # A deleted tag can linger for a moment; `--target` makes it again at this commit.
          gh release create nightly --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Turu $VERSION ($short)" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --latest=false dist/*
