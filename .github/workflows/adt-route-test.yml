name: ADT route test

# Throwaway (branch ci-adt-route): which way ADT packages Turu Mas on Linux (legacy, with the AIR
# SDK's d8 1.2.52, or through Gradle and AGP 8.9.1), whether `-platformsdk` changes it, and
# whether the Gradle route dexes Compose 1.13's Java 11 classes. Builds nothing it publishes.
on:
  push:
    branches: [ci-adt-route]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adt:
    name: ADT route on Linux
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.0.0
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7

      # Cargo resolves the workspace's patches in ruffle/; rustls-platform-verifier's Kotlin half
      # goes into the extension's jar.
      - run: git submodule update --init --depth 1 ruffle android/vendor/rustls-platform-verifier

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # JDK 21 for Gradle (the extension's Kotlin); JDK 17 for AIR's tools (ADT packages with a
      # Gradle that doesn't run on newer ones): `AIR_JAVA_HOME` below.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Downloading the AIR SDK accepts its license (docs/TURU_MAS.md, "The AIR SDK's license"):
      # free tier, so the app starts with the SDK's splash screen. Sets AIR_HOME.
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.5.1.1"
          accept-license: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: turu-mas-android-arm64

      - name: Install the Android SDK parts, cargo-ndk and libclang
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          cargo install cargo-ndk --version 4.1.2 --locked
          sudo apt-get update
          sudo apt-get install -y libclang-dev libc++1
          libclang=$(find /usr/lib/llvm-* -name 'libclang.so*' | sort -V | tail -1)
          echo "LIBCLANG_PATH=$(dirname "$libclang")" | tee -a "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" | tee -a "$GITHUB_ENV"
          # The AIR SDK's Linux aapt (ADT runs it) loads the SDK's own lib64/libc++.so, which
          # lacks a symbol it needs ("undefined symbol: ...basic_ostringstream..."; 51.5.1.1).
          # Ubuntu's libc++ has it: a folder with just a `libc++.so` link to it, first on the
          # library path, serves aapt and nothing else (no other tool here asks for that name).
          mkdir -p "$RUNNER_TEMP/libcxx"
          ln -sf /usr/lib/x86_64-linux-gnu/libc++.so.1 "$RUNNER_TEMP/libcxx/libc++.so"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libcxx" | tee -a "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/libcxx" "$AIR_HOME/lib/android/bin/aapt" version

      - name: Turn on ADT's debug log
        run: printf '\nDebugOut=true\nVerboseOut=true\nKeepAndroidStudioOutput=true\n' >> "$AIR_HOME/lib/adt.cfg"

      # A: as the release job builds today (development key).
      - name: "A: build as today"
        run: |
          AIR_JAVA_HOME="$JAVA_HOME_17_X64" air/app/build.sh --no-install
          mkdir -p adt-logs && cp ~/adt.log adt-logs/a-default.log
          grep -n "legacy\|Android Studio\|location passed\|Using gradle\|dx\|d8" ~/adt.log || true

      # B: the same files packaged again, naming the Android SDK.
      - name: "B: package with -platformsdk"
        continue-on-error: true
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          cd target/air-app
          : > ~/adt.log
          AIR_NOANDROIDFLAIR=true "$AIR_HOME/bin/adt" -package -target apk-captive-runtime -arch armv8 \
            -storetype pkcs12 -keystore dev.p12 -storepass turumasdev "$RUNNER_TEMP/b.apk" app.xml \
            -platformsdk "$ANDROID_HOME" -extdir ext -C . TuruAirHost.swf turu.swf icons
          cp ~/adt.log "$GITHUB_WORKSPACE/adt-logs/b-platformsdk.log"
          grep -n "legacy\|Android Studio\|location passed\|Using gradle\|dx\|d8" ~/adt.log || true
          ls -la "$RUNNER_TEMP/b.apk"

      # C: ADT's Gradle project (-target android-studio), with Compose 1.13's and Material 3
      # 1.5's classes (Java 11 class files) added, built by ADT's own Gradle.
      - name: "C: Gradle route with Compose 1.13's classes"
        continue-on-error: true
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          cd target/air-app
          : > ~/adt.log
          AIR_NOANDROIDFLAIR=true "$AIR_HOME/bin/adt" -package -target android-studio "$RUNNER_TEMP/studio" \
            app.xml -platformsdk "$ANDROID_HOME" -extdir ext -C . TuruAirHost.swf turu.swf icons
          cp ~/adt.log "$GITHUB_WORKSPACE/adt-logs/c-export.log"
          cd "$RUNNER_TEMP/studio"
          maven=https://dl.google.com/android/maven2/androidx
          for lib in compose/runtime/runtime-android/1.13.0 compose/ui/ui-android/1.13.0 \
              compose/foundation/foundation-android/1.13.0 compose/material3/material3-android/1.5.0; do
            name=$(echo "$lib" | cut -d/ -f3)
            curl -fsSL "$maven/$lib/$name-$(basename "$lib").aar" -o "$RUNNER_TEMP/$name.aar"
            unzip -p "$RUNNER_TEMP/$name.aar" classes.jar > "app/libs/$name.jar"
            sed -i "s|^dependencies {|dependencies {\n    implementation files('libs/$name.jar')|" app/build.gradle
          done
          grep -n "libs/" app/build.gradle
          java -Xmx2048m -Dorg.gradle.appname=gradlew \
            -cp "gradle/wrapper/gradle-wrapper.jar:$AIR_HOME/lib/android/bin/gradle-cli.jar" \
            org.gradle.wrapper.GradleWrapperMain -q :app:assembleDebug
          apk=$(find app/build/outputs -name '*.apk' | head -1)
          ls -la "$apk"
          python3 -I - "$apk" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          dex = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
          for c in (b"Landroidx/compose/material3/ButtonKt;", b"Landroidx/compose/runtime/Composer;"):
              print(c.decode(), "in dex:", c in dex)
          PY

      - name: "Linux SDK layout"
        if: always()
        run: |
          cd "$AIR_HOME"
          find . -path '*android*' -name '*.apk' | head -20
          ls -la air/android/device/arm8 2>&1 | head || true
          ls lib/android/lib/resources/captive_runtime 2>&1 | head || true

      # D: the Android SDK at Linux's default location (no -platformsdk).
      - name: "D: SDK at ~/Android/Sdk"
        continue-on-error: true
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" PATH="$JAVA_HOME_17_X64/bin:$PATH"
          mkdir -p ~/Android && ln -sfn "$ANDROID_HOME" ~/Android/Sdk
          cd target/air-app
          : > ~/adt.log
          AIR_NOANDROIDFLAIR=true "$AIR_HOME/bin/adt" -package -target apk-captive-runtime -arch armv8 \
            -storetype pkcs12 -keystore dev.p12 -storepass turumasdev "$RUNNER_TEMP/d.apk" app.xml \
            -extdir ext -C . TuruAirHost.swf turu.swf icons || echo "adt exit $?"
          cp ~/adt.log "$GITHUB_WORKSPACE/adt-logs/d-default-location.log"
          grep -n "legacy\|Android Studio\|location passed\|Using gradle\|out of date" ~/adt.log || true

      - name: Keep the build for macOS
        uses: actions/upload-artifact@v7
        with:
          name: air-app
          path: |
            target/air-app/app.xml
            target/air-app/dev.p12
            target/air-app/ext/
            target/air-app/icons/
            target/air-app/res/
            target/air-app/TuruAirHost.swf
            target/air-app/turu.swf

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adt-logs
          path: adt-logs/
          if-no-files-found: warn

  mac:
    name: ADT route on macOS
    needs: adt
    if: always()
    runs-on: macos-15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.5.1.1"
          accept-license: true
      - uses: actions/download-artifact@v7
        with:
          name: air-app
          path: target/air-app
      - name: Turn on ADT's debug log
        run: |
          printf '\nDebugOut=true\nVerboseOut=true\nKeepAndroidStudioOutput=true\n' >> "$AIR_HOME/lib/adt.cfg"
          mkdir -p adt-logs
          # build.sh writes the resources' folder into app.xml as an absolute path (Linux's).
          perl -pi -e "s|<resdir>.*</resdir>|<resdir>$PWD/target/air-app/res</resdir>|" target/air-app/app.xml
          grep -n resdir target/air-app/app.xml
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" || true

      # B: the same files packaged again, naming the Android SDK.
      - name: "B: package with -platformsdk"
        continue-on-error: true
        run: |
          export JAVA_HOME="$JAVA_HOME_17_ARM64" PATH="$JAVA_HOME_17_ARM64/bin:$PATH"
          cd target/air-app
          : > ~/adt.log
          AIR_NOANDROIDFLAIR=true "$AIR_HOME/bin/adt" -package -target apk-captive-runtime -arch armv8 \
            -storetype pkcs12 -keystore dev.p12 -storepass turumasdev "$RUNNER_TEMP/b.apk" app.xml \
            -platformsdk "$ANDROID_HOME" -extdir ext -C . TuruAirHost.swf turu.swf icons
          cp ~/adt.log "$GITHUB_WORKSPACE/adt-logs/b-platformsdk.log"
          grep -n "legacy\|Android Studio\|location passed\|Using gradle\|dx\|d8" ~/adt.log || true
          ls -la "$RUNNER_TEMP/b.apk"

      # C: ADT's Gradle project (-target android-studio), with Compose 1.13's and Material 3
      # 1.5's classes (Java 11 class files) added, built by ADT's own Gradle.
      - name: "C: Gradle route with Compose 1.13's classes"
        continue-on-error: true
        run: |
          export JAVA_HOME="$JAVA_HOME_17_ARM64" PATH="$JAVA_HOME_17_ARM64/bin:$PATH"
          cd target/air-app
          : > ~/adt.log
          AIR_NOANDROIDFLAIR=true "$AIR_HOME/bin/adt" -package -target android-studio "$RUNNER_TEMP/studio" \
            app.xml -platformsdk "$ANDROID_HOME" -extdir ext -C . TuruAirHost.swf turu.swf icons
          cp ~/adt.log "$GITHUB_WORKSPACE/adt-logs/c-export.log"
          cd "$RUNNER_TEMP/studio"
          maven=https://dl.google.com/android/maven2/androidx
          for lib in compose/runtime/runtime-android/1.13.0 compose/ui/ui-android/1.13.0 \
              compose/foundation/foundation-android/1.13.0 compose/material3/material3-android/1.5.0; do
            name=$(echo "$lib" | cut -d/ -f3)
            curl -fsSL "$maven/$lib/$name-$(basename "$lib").aar" -o "$RUNNER_TEMP/$name.aar"
            unzip -p "$RUNNER_TEMP/$name.aar" classes.jar > "app/libs/$name.jar"
            perl -0pi -e "s|dependencies \\{|dependencies {\\n    implementation files('libs/$name.jar')|" app/build.gradle
          done
          grep -n "libs/" app/build.gradle
          java -Xmx2048m -Dorg.gradle.appname=gradlew \
            -cp "gradle/wrapper/gradle-wrapper.jar:$AIR_HOME/lib/android/bin/gradle-cli.jar" \
            org.gradle.wrapper.GradleWrapperMain -q :app:assembleDebug
          apk=$(find app/build/outputs -name '*.apk' | head -1)
          ls -la "$apk"
          python3 -I - "$apk" <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          dex = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
          for c in (b"Landroidx/compose/material3/ButtonKt;", b"Landroidx/compose/runtime/Composer;"):
              print(c.decode(), "in dex:", c in dex)
          PY

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adt-logs-macos
          path: adt-logs/
          if-no-files-found: warn
