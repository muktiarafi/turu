name: CI

# Every pull request to main (and every push to main) is checked here: the branch is rebased on
# main with no merge commits, the submodules point at pushed commits, the Rust code is formatted
# and passes clippy with no warning, the tests pass and the scripts type-check against this
# commit's bot/js/turu.ts. CONTRIBUTING.md lists the same
# commands to run before pushing. Branch protection on main requires these jobs.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The app's feature set (CLAUDE.md), the same on every platform.
  FEATURES: turu/software_video,turu/external_video,turu/lzma,turu/jpegxr,turu/fontconfig-dlopen

jobs:
  rebased:
    name: Rebased on main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The pull request's own commits, not the merge commit GitHub makes for it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the branch is rebased on main, without merge commits
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          if ! git merge-base --is-ancestor "origin/$BASE" HEAD; then
            echo "::error::The branch is behind $BASE. Rebase it: git fetch origin && git rebase origin/$BASE && git push --force-with-lease"
            exit 1
          fi
          merges=$(git rev-list --merges "origin/$BASE..HEAD")
          if [[ -n "$merges" ]]; then
            echo "::error::The branch has merge commits ($(echo $merges | tr '\n' ' ')). Rebase instead of merging: git rebase origin/$BASE"
            exit 1
          fi
          echo "Rebased on $BASE: $(git rev-list --count "origin/$BASE..HEAD") commit(s) on top"

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Only Turu's own code: Ruffle's files in app/ keep their own layout (docs/STATUS.md,
      # "Formatting"). The UI windows, mod.rs included, use max_width = 120.
      - name: Check the bot engine's formatting
        run: cargo fmt -p turu_bot --check

      # turu_shell has its own rustfmt.toml (max_width = 120).
      - name: Check the shell library's formatting
        run: cargo fmt -p turu_shell --check

      - name: Check the UI windows' formatting
        run: |
          for file in egui_ui/src/gui/turu/*.rs; do
            rustfmt --edition 2024 --config max_width=120 --check "$file"
          done

  # A submodule bump must point at a commit already on that submodule's branch (.gitmodules):
  # otherwise a clone of this commit can't fetch it. Commits only, no files (`tree:0`).
  submodules:
    name: Submodules pushed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check each submodule's commit is on its branch
        run: |
          status=0
          for path in ruffle scripts; do
            url=$(git config -f .gitmodules "submodule.$path.url")
            branch=$(git config -f .gitmodules "submodule.$path.branch")
            commit=$(git rev-parse "HEAD:$path")
            git init -q "$RUNNER_TEMP/$path"
            git -C "$RUNNER_TEMP/$path" fetch -q --filter=tree:0 "$url" "$branch"
            if git -C "$RUNNER_TEMP/$path" cat-file -e "$commit^{commit}" 2>/dev/null \
              && git -C "$RUNNER_TEMP/$path" merge-base --is-ancestor "$commit" FETCH_HEAD; then
              echo "$path: $commit is on $branch"
            else
              echo "::error::$path points at $commit, which isn't on $branch of $url. Push it there first."
              status=1
            fi
          done
          exit $status

  # Every warning fails, Ruffle's crates' included (RUSTFLAGS reaches the path dependencies;
  # crates.io's are capped by Cargo).
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - run: git submodule update --init --depth 1 ruffle

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Ruffle compiles its Flash classes (playerglobal) with asc.jar.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps

      # The client library has no UI toolkit (docs/NATIVE_UI_PROPOSAL.md, L1): the egui windows are
      # turu_egui's. Built alone, with and without Ruffle, as the workspace would unify features.
      - name: Keep the client library free of egui
        run: |
          cargo tree --locked -p turu_frontend -e normal --prefix none > "$RUNNER_TEMP/frontend-tree.txt"
          found=$(grep -E '^(egui|egui-wgpu|egui-winit|egui_extras|epaint|winit|rfd) ' \
            "$RUNNER_TEMP/frontend-tree.txt" | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::turu_frontend depends on $found"
            exit 1
          fi
          cargo check --locked -p turu_frontend --all-targets
          cargo check --locked -p turu_frontend --no-default-features --all-targets

      # The native shells' types (docs/NATIVE_UI_PROPOSAL.md, L4): every model's records generate
      # for Kotlin (turu-typegen fails on a model it doesn't list), and every model's view reads
      # in process from a fresh tab. The Android build decodes those views into the types
      # (GeneratedTypesTest); this job has no Android SDK, so it checks the Rust side.
      - name: Generate the native shells' types
        run: |
          cargo run --locked -q -p turu_frontend --no-default-features --features typegen \
            --bin turu-typegen -- "$RUNNER_TEMP/types" --samples "$RUNNER_TEMP/samples"
          ls "$RUNNER_TEMP/samples"

      # The shell's logic is a library any shell's window hosts (docs/NATIVE_UI_PROPOSAL.md, L1):
      # alone, with no window toolkit, dialogs or player in it. Built alone, as the workspace's
      # other crates would otherwise turn `ruffle` on for it.
      - name: Keep the shell library windowless
        run: |
          cargo tree --locked -p turu_shell -e normal --prefix none > "$RUNNER_TEMP/shell-tree.txt"
          found=$(grep -E '^(winit|rfd|ruffle_core|ruffle_render_wgpu|egui-winit|egui-wgpu) ' \
            "$RUNNER_TEMP/shell-tree.txt" | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::turu_shell depends on $found"
            exit 1
          fi
          cargo check --locked -p turu_shell --all-targets
          # Android's app takes only its slots (`SlotShell`), without the desktop shell.
          cargo check --locked -p turu_shell --no-default-features --all-targets

      # redundant_clone is allowed as in CLAUDE.md: it flags clones that are needed.
      - name: Clippy
        run: |
          cargo clippy --locked -p turu_bot -p turu_frontend -p turu_egui -p turu_shell -p turu --all-targets \
            --no-default-features --features "$FEATURES" -- -D warnings -A clippy::redundant_clone

  # bot/assets/turu.swf, Turu's host SWF, is built from host/as3 (turu_host) and committed, so a
  # Rust-only build needs no Java: check it is what the source builds.
  host:
    name: Host SWF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: git submodule update --init --depth 1 ruffle

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # asc.jar compiles the host SWF and Ruffle's playerglobal.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-host
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt -p turu_host --check

      - name: Clippy
        run: cargo clippy --locked -p turu_host --all-targets

      - name: Test the build
        run: cargo test --locked -p turu_host

      - name: Check turu.swf is built from host/as3
        run: cargo run --locked -p turu_host -- --check

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      # scripts/ (turu-scripts): the engine tests load its scripts, and they are type-checked
      # against this commit's bot/js/turu.ts.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps

      # cargo-nextest runs each test in its own process and every binary's tests at once
      # (.config/nextest.toml). There are no doctests for it
      # to miss. One command for all three crates: tested apart, the engine's dependencies
      # resolved other features, and oxc, rquickjs and turu_bot compiled twice.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test the bot engine, the app and the frontend
        run: |
          cargo nextest run --locked --profile ci -p turu_bot -p turu -p turu_frontend -p turu_egui -p turu_shell \
            --no-default-features --features "$FEATURES"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Type-check scripts
        working-directory: scripts
        run: npx -y -p typescript@5.9.3 tsc --noEmit -p .
