<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Turu Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6cf0'/%3E%3Cpath d='M9 10h14v3h-5.5v10h-3V13H9z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Mugetsu's palette (desktop/src/gui/turu/theme.rs), with a light variant. */
:root {
  --bg: #0c0d13; --panel: #11131a; --card: #181b25; --inset: #0c0d13; --edge: #3a3e4e;
  --track: #303442; --hover: #282c3a; --accent: #7c6cf0; --text: #e8eaf2; --muted: #8c92a6;
  --ok: #34d399; --warn: #fbbf24; --bad: #ef4444; --hp: #34d399; --mp: #60a5fa; --tg: #f87171;
  --radius: 12px; --small: 8px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4f8; --panel: #ffffff; --card: #ffffff; --inset: #f0f1f6; --edge: #d6d9e4;
    --track: #e3e5ee; --hover: #eceef5; --accent: #6a59e0; --text: #181b25; --muted: #5d6378;
    --ok: #059669; --warn: #b45309; --bad: #dc2626; --hp: #059669; --mp: #2563eb; --tg: #dc2626;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4f8; --panel: #ffffff; --card: #ffffff; --inset: #f0f1f6; --edge: #d6d9e4;
  --track: #e3e5ee; --hover: #eceef5; --accent: #6a59e0; --text: #181b25; --muted: #5d6378;
  --ok: #059669; --warn: #b45309; --bad: #dc2626; --hp: #059669; --mp: #2563eb; --tg: #dc2626;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button {
  background: var(--card); border: 1px solid var(--edge); border-radius: var(--small);
  padding: 6px 12px; cursor: pointer;
}
button:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--edge)); }
button.small { padding: 3px 9px; font-size: 13px; }
input[type=text], input[type=password], select {
  background: var(--inset); border: 1px solid var(--edge); border-radius: var(--small);
  padding: 6px 10px; min-width: 0;
}
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
input:focus-visible, button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

header {
  position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--edge);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
.brand i {
  width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-style: normal; font-size: 15px;
}
.summary { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.summary b { color: var(--text); font-weight: 600; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.ok::before { background: var(--ok); }
.live.warn::before { background: var(--warn); }
.spacer { flex: 1; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }

.bar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px 0; }
.bar-row input[type=text] { flex: 1 1 180px; max-width: 320px; }
.views { display: flex; gap: 4px; flex-wrap: wrap; }
.bulk { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.bulk[hidden] { display: none; }
.notice {
  margin: 12px 16px 0; padding: 10px 14px; border-radius: var(--small);
  background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--edge));
}
main { padding: 12px 16px 24px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.empty { color: var(--muted); padding: 32px 0; text-align: center; }
h2.group { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 18px 0 8px; }
h2.group:first-child { margin-top: 0; }

.card { background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); padding: 14px; min-width: 0; display: flex; flex-direction: column; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.stale, .card.offline { opacity: .65; }
.card .hd { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chip { font-size: 12px; color: var(--muted); background: var(--inset); border: 1px solid var(--edge); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.name:hover { color: var(--accent); background: none; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, transparent); }
.pill.off { color: var(--muted); background: var(--inset); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin-top: 12px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv span:nth-child(even) { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 6px; margin-top: 12px; }
.meter { position: relative; height: 18px; background: var(--track); border-radius: 6px; overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.meter em { position: relative; display: block; font-style: normal; font-size: 12px; line-height: 18px; padding: 0 8px; font-variant-numeric: tabular-nums; text-shadow: 0 0 3px var(--bg); }
.session { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 13px; }
.session b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
details { margin-top: 10px; border-top: 1px solid var(--edge); padding-top: 8px; }
summary { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; margin-right: 6px; transition: transform .15s; }
details[open] summary::before { transform: rotate(90deg); }
summary span { flex: 1; }
summary small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
details ul { margin: 6px 0 0; padding-left: 18px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 12px; text-align: center; }
.stats div { background: var(--inset); border-radius: var(--small); padding: 6px 2px; }
.stats b { display: block; font-variant-numeric: tabular-nums; }
.stats small { color: var(--muted); font-size: 11px; }
.recent { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; font-size: 12px; }
.recent li, .events li { display: flex; gap: 8px; min-width: 0; }
.recent li span:last-child, .events li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ev-scriptError, .ev-death, .ev-connectionLost { color: var(--bad); }
.ev-relogin, .ev-logout { color: var(--warn); }
.ev-drop { color: var(--ok); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }
.actions .spacer { flex: 1; }

.table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--edge); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--edge); }
th { color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ▲"; }
th[aria-sort="descending"]::after { content: " ▼"; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--edge); border-radius: var(--radius); padding: 18px; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
dialog h2 { margin: 0 0 6px; font-size: 16px; }
dialog p { color: var(--muted); margin: 0 0 12px; }
dialog input[type=password] { width: 100%; }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
#detail { width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; }
#detail[open] { display: flex; flex-direction: column; }
.d-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--edge); }
.d-head h2 { margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-body { padding: 14px 18px; overflow: auto; display: grid; gap: 14px; }
.d-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.d-controls input { width: 120px; }
.d-tabs { display: flex; gap: 4px; }
.log { background: var(--inset); border: 1px solid var(--edge); border-radius: var(--small); height: 320px; overflow: auto; padding: 8px 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 320px; overflow: auto; }
.chart { display: grid; gap: 10px; }
.chart figure { margin: 0; background: var(--inset); border: 1px solid var(--edge); border-radius: var(--small); padding: 10px 12px; }
.chart figcaption { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.chart figcaption b { color: var(--text); font-variant-numeric: tabular-nums; }
.chart svg { display: block; width: 100%; height: 80px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 10; max-width: calc(100vw - 32px); }
.toast { background: var(--panel); border: 1px solid var(--edge); border-left: 3px solid var(--ok); border-radius: var(--small); padding: 8px 12px; box-shadow: 0 6px 20px rgb(0 0 0 / .3); }
.toast.bad { border-left-color: var(--bad); }

body.streamer .priv { filter: blur(6px); }
@media (max-width: 560px) {
  .summary { order: 3; width: 100%; }
  .bulk { margin-left: 0; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><i aria-hidden="true">T</i>Turu Monitor</div>
  <div class="summary" id="summary"></div>
  <span class="spacer"></span>
  <span class="live" id="live">Connecting…</span>
  <div class="tools">
    <button id="streamer" type="button" title="Blur names, gold and rooms">Streamer mode</button>
    <button id="keyButton" type="button">Key</button>
  </div>
</header>
<div class="notice" id="notice" hidden></div>
<div class="bar-row">
  <input type="text" id="filter" placeholder="Filter bots" aria-label="Filter bots">
  <div class="views" id="views" role="tablist"></div>
  <div class="bulk" id="bulk" hidden></div>
</div>
<main id="main"></main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="keyDialog">
  <form method="dialog">
    <h2>Monitor key</h2>
    <p>Other devices need the key from Turu: Options &gt; Application &gt; Monitor &gt; Copy Link or Copy Key.</p>
    <input type="password" id="keyInput" autocomplete="off" aria-label="Monitor key">
    <div class="row"><button value="cancel">Cancel</button><button value="save" class="primary">Save</button></div>
  </form>
</dialog>
<dialog id="confirmDialog">
  <form method="dialog">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmText"></p>
    <div class="row"><button value="cancel">Cancel</button><button value="ok" class="primary" id="confirmOk">OK</button></div>
  </form>
</dialog>
<dialog id="detail" aria-labelledby="dTitle">
  <div class="d-head"><span class="chip" id="dChip"></span><h2 id="dTitle" class="priv"></h2><span class="pill" id="dPill"></span><button type="button" id="dClose" aria-label="Close">✕</button></div>
  <div class="d-body">
    <div class="d-controls" id="dControls"></div>
    <div class="d-tabs" id="dTabs" role="tablist"></div>
    <div id="dPane"></div>
  </div>
</dialog>
<script>
"use strict";
// The bots come from GET /api/events; commands go to POST /api/bots/<id>/... (bot/src/monitor/server.rs).
const $ = s => document.querySelector(s);
const STALE_MS = 15000;
const KEY = "turu-monitor-key";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
const clock = s => s == null ? "-" : `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const perHour = (n, s) => s >= 60 ? Math.round(n * 3600 / s) : null;
const ago = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : s < 172800 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
const time = at => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

// A link from Turu carries the key after "#key=": the browser never sends it to a server.
(() => {
  const m = location.hash.match(/key=([^&]+)/);
  if (m) {
    store.set(KEY, decodeURIComponent(m[1]));
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
let key = store.get(KEY) || "";
let state = null, view = store.get("turu-monitor-view") || "cards";
let sort = { col: null, dir: 1 };
const picked = new Set();
const openSections = new Map(Object.entries(JSON.parse(store.get("turu-monitor-sections") || "{}")));
const headers = () => key ? { Authorization: `Bearer ${key}` } : {};
const control = () => state?.allowControl === true;
const byId = id => state?.bots.find(b => b.id === id);

const STATES = {
  playing: ["Playing", "ok"], dead: ["Dead", "bad"], loading: ["Loading", "warn"],
  loggedOut: ["Logged out", "off"], notLoaded: ["Game not loaded", "off"],
};
function status(b) {
  const s = b.snapshot;
  if (!b.online) return [b.lastSeen ? `Offline · ${ago(state.now - b.lastSeen)}` : "Offline", "off"];
  if (!s) return [b.kind === "army" ? "Starting…" : "Waiting…", "off"];
  if (b.kind === "tab" && state.now - s.sampledAt > STALE_MS) return ["Not responding", "bad"];
  if (s.relogging) return ["Relogging", "warn"];
  if (s.script.status === "[Error]") return ["Script error", "bad"];
  const [label, kind] = STATES[s.state] || [s.state, "off"];
  return [s.state === "playing" && s.script.running ? (s.script.status === "[Paused]" ? "Paused" : "Running") : label, kind];
}
const chip = b => b.kind === "offline" ? "Last run" : b.kind === "army" ? `Army · ${b.label}` : b.label;
const meter = (cur, max, color, label) =>
  `<div class="meter" role="meter" aria-label="${label}" aria-valuenow="${cur ?? 0}" aria-valuemax="${max ?? 0}"><i style="width:${pct(cur, max)}%;background:${color}"></i><em>${label} ${fmt(cur)} / ${fmt(max)}</em></div>`;
function section(b, title, items) {
  const id = `${b.id}:${title}`;
  const open = openSections.get(id) === true;
  const list = items.length ? `<ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : `<div class="empty" style="padding:6px 0;text-align:left">None</div>`;
  return `<details data-id="${esc(id)}"${open ? " open" : ""}><summary><span>${title}</span><small>${esc(items[0] ?? "-")}${items.length > 1 ? ` +${items.length - 1}` : ""}</small></summary>${list}</details>`;
}
const eventRow = e => `<li class="ev-${esc(e.kind)}"><span class="when">${time(e.at)}</span><span>${esc(e.text)}</span></li>`;

// The buttons a bot gets: [label, route, confirm text or null, style].
function actionsFor(b, full) {
  if (!control()) return [];
  if (!b.online) return b.kind === "tab" ? [] : [["Forget", "/forget", `Forget ${b.snapshot?.name ?? b.label}? Its saved events and history go too.`, "danger"]];
  const s = b.snapshot, list = [];
  if (s?.script.running) {
    list.push(s.script.status === "[Paused]" ? ["Resume", "/script/resume", null, ""] : ["Pause", "/script/pause", null, ""]);
    list.push(["Stop", "/script/stop", `Stop ${s.script.name ?? "the script"} on ${s.name}?`, "danger"]);
  } else if (s?.script.name) {
    list.push([`Start ${s.script.name}`, "/script/start", null, "primary"]);
  }
  if (full) {
    if (s && s.state !== "loggedOut" && s.state !== "notLoaded") {
      list.push(["Relogin", "/relogin", `Log ${s.name} out and back in?`, ""]);
      list.push(["House", "/house", null, ""]);
      list.push(["Log out", "/logout", `Log ${s.name} out? Auto Relogin won't bring it back.`, "danger"]);
    } else if (s?.state === "loggedOut") {
      list.push(["Log in", "/login", null, "primary"]);
    }
  }
  return list;
}
const buttons = (b, list, cls = "small") => list.map(([label, route, , style]) =>
  `<button type="button" class="${cls} ${style}" data-act="${esc(route)}" data-id="${esc(b.id)}">${esc(label)}</button>`).join("");

function card(b) {
  const s = b.snapshot, [label, kind] = status(b);
  const on = picked.has(b.id);
  const head = `<div class="hd"><input type="checkbox" data-pick="${esc(b.id)}" aria-label="Select ${esc(s?.name ?? b.label)}"${on ? " checked" : ""}><span class="chip">${esc(chip(b))}</span><button type="button" class="name priv" data-open="${esc(b.id)}" title="Details">${esc(s?.name ?? b.label)}</button><span class="pill ${kind}">${esc(label)}</span></div>`;
  const acts = actionsFor(b, false);
  const foot = `<div class="actions">${buttons(b, acts)}<span class="spacer"></span><button type="button" class="small" data-open="${esc(b.id)}">Details</button></div>`;
  const cls = `card${on ? " picked" : ""}${b.online ? "" : " offline"}${b.online && b.kind === "tab" && s && state.now - s.sampledAt > STALE_MS ? " stale" : ""}`;
  const recent = b.recent?.length ? `<ul class="recent">${b.recent.map(eventRow).join("")}</ul>` : "";
  if (!s || !["playing", "dead", "loading"].includes(s.state)) {
    const script = s?.script?.name ? `<div class="kv"><span>Script</span><span>${esc(s.script.name)} ${esc(s.script.status)}</span></div>` : "";
    return `<article class="${cls}">${head}${script}${recent}${foot}</article>`;
  }
  const inv = s.inventory.slots ? `${fmt(s.inventory.used)} / ${fmt(s.inventory.slots)}` : `${fmt(s.inventory.items)} items`;
  const run = s.stats.runSeconds;
  const sess = s.session;
  const gph = sess && perHour(sess.gold, sess.seconds), xph = sess && perHour(sess.xp, sess.seconds);
  const map = s.map.match(/^(.*?)(-\d+)$/);
  const target = s.target ? meter(s.target.hp, s.target.maxHp, "var(--tg)", esc(s.target.name)) : "";
  return `<article class="${cls}">${head}
  <div class="kv">
    <span>Map</span><span>${map ? `${esc(map[1])}<span class="priv">${esc(map[2])}</span>` : esc(s.map || "-")}</span>
    <span>Cell</span><span>${esc(s.cell)} · ${esc(s.pad)}</span>
    <span>Server</span><span>${esc(s.server || "-")}</span>
    <span>Level</span><span>${esc(s.level)}${s.class ? " · " + esc(s.class) : ""}</span>
    <span>Gold</span><span class="priv">${fmt(s.gold)}</span>
    <span>AC</span><span>${fmt(s.coins)}</span>
    <span>Inventory</span><span>${inv}</span>
    <span>Script</span><span>${esc(s.script.name ?? "None")}${s.script.running && run != null ? ` · ${clock(run)}` : ""}</span>
  </div>
  <div class="bars">${meter(s.hp.cur, s.hp.max, "var(--hp)", "HP")}${meter(s.mp.cur, s.mp.max, "var(--mp)", "MP")}${b.online ? target : ""}</div>
  ${sess ? `<div class="session"><span>Gold <b>+${fmt(sess.gold)}</b>${gph != null ? ` (${fmt(gph)}/h)` : ""}</span><span>XP <b>+${fmt(sess.xp)}</b>${xph != null ? ` (${fmt(xph)}/h)` : ""}</span></div>` : ""}
  ${section(b, "Quests", s.quests)}${section(b, "Equipment", s.equipment)}
  <div class="stats">${[["kills", "Kills"], ["drops", "Drops"], ["questsCompleted", "Quests"], ["deaths", "Deaths"], ["relogins", "Relogins"]]
    .map(([k, l]) => `<div><b>${fmt(s.stats[k])}</b><small>${l}</small></div>`).join("")}</div>
  ${recent}${foot}
</article>`;
}

// Table views (Skua Nexus's three): [title, value for sorting, html, numeric].
const name = b => b.snapshot?.name ?? b.label;
const nameCell = b => `<button type="button" class="name priv" data-open="${esc(b.id)}">${esc(name(b))}</button>`;
const TABLES = {
  scripts: [
    ["Bot", b => chip(b), b => esc(chip(b))],
    ["Character", name, nameCell],
    ["Script", b => b.snapshot?.script.name ?? "", b => esc(b.snapshot?.script.name ?? "-")],
    ["Status", b => status(b)[0], b => { const [l, k] = status(b); return `<span class="pill ${k}">${esc(l)}</span>`; }],
    ["Run time", b => b.snapshot?.stats.runSeconds ?? -1, b => clock(b.snapshot?.stats.runSeconds), true],
    ["Gold / h", b => perHour(b.snapshot?.session?.gold ?? 0, b.snapshot?.session?.seconds ?? 0) ?? -1, b => { const s = b.snapshot?.session; const v = s && perHour(s.gold, s.seconds); return v == null ? "-" : fmt(v); }, true],
  ],
  accounts: [
    ["Character", name, nameCell],
    ["Level", b => b.snapshot?.level ?? 0, b => fmt(b.snapshot?.level), true],
    ["Class", b => b.snapshot?.class ?? "", b => esc(b.snapshot?.class ?? "-")],
    ["Gold", b => b.snapshot?.gold ?? 0, b => `<span class="priv">${fmt(b.snapshot?.gold)}</span>`, true],
    ["AC", b => b.snapshot?.coins ?? 0, b => fmt(b.snapshot?.coins), true],
    ["Inventory", b => b.snapshot?.inventory.used ?? 0, b => { const i = b.snapshot?.inventory; return i?.slots ? `${fmt(i.used)} / ${fmt(i.slots)}` : "-"; }, true],
    ["Map", b => b.snapshot?.map ?? "", b => `<span class="priv">${esc(b.snapshot?.map || "-")}</span>`],
  ],
  resources: [
    ["Character", name, nameCell],
    ...[["Kills", "kills"], ["Drops", "drops"], ["Quests", "questsCompleted"], ["Deaths", "deaths"], ["Relogins", "relogins"]]
      .map(([t, k]) => [t, b => b.snapshot?.stats[k] ?? 0, b => fmt(b.snapshot?.stats[k]), true]),
  ],
};
const VIEWS = [["cards", "Cards"], ["scripts", "Scripts"], ["accounts", "Accounts"], ["resources", "Resources"]];

function table(list) {
  const cols = TABLES[view];
  if (sort.col != null && cols[sort.col]) {
    const f = cols[sort.col][1];
    list = [...list].sort((a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
  }
  const head = cols.map((c, i) => `<th data-col="${i}" scope="col"${sort.col === i ? ` aria-sort="${sort.dir > 0 ? "ascending" : "descending"}"` : ""}>${c[0]}</th>`).join("");
  const rows = list.map(b => `<tr>${cols.map(c => `<td${c[3] ? ' class="num"' : ""}>${c[2](b)}</td>`).join("")}</tr>`).join("");
  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// Bulk actions on the selected bots: [label, route, which bots it applies to, style].
const BULK = [
  ["Start", "/script/start", b => b.online && !b.snapshot?.script.running && b.snapshot?.script.name, "primary"],
  ["Stop", "/script/stop", b => b.online && b.snapshot?.script.running, "danger"],
  ["Relogin", "/relogin", b => b.online && ["playing", "dead", "loading"].includes(b.snapshot?.state), ""],
  ["Forget", "/forget", b => !b.online && b.kind !== "tab", "danger"],
];
function renderBulk() {
  const bulk = $("#bulk");
  for (const id of picked) if (!byId(id)) picked.delete(id);
  bulk.hidden = !picked.size;
  if (!picked.size) return;
  const chosen = [...picked].map(byId);
  bulk.innerHTML = `<span class="when">${picked.size} selected</span>` + (control() ? BULK.map(([l, r, ok, style]) => {
    const n = chosen.filter(ok).length;
    return `<button type="button" class="small ${style}" data-bulk="${r}"${n ? "" : " disabled"}>${l}${n ? ` (${n})` : ""}</button>`;
  }).join("") : "") + `<button type="button" class="small" data-bulk="clear">Clear</button>`;
}

function render() {
  $("#views").innerHTML = VIEWS.map(([v, l]) => `<button type="button" role="tab" aria-selected="${v === view}" class="${v === view ? "on" : ""}" data-view="${v}">${l}</button>`).join("");
  if (!state) return;
  const q = $("#filter").value.trim().toLowerCase();
  const list = state.bots.filter(b => !q || `${chip(b)} ${name(b)} ${b.snapshot?.script.name ?? ""} ${b.snapshot?.map ?? ""}`.toLowerCase().includes(q));
  const live = state.bots.filter(b => b.online);
  const playing = live.filter(b => b.snapshot?.state === "playing").length;
  const running = live.filter(b => b.snapshot?.script.running).length;
  const kills = live.reduce((n, b) => n + (b.snapshot?.stats.kills ?? 0), 0);
  const gph = live.reduce((n, b) => { const s = b.snapshot?.session; return n + ((s && perHour(s.gold, s.seconds)) ?? 0); }, 0);
  $("#summary").innerHTML = `<span><b>${playing}</b>/${live.length} playing</span><span><b>${running}</b> running</span><span><b>${fmt(kills)}</b> kills</span><span><b>${fmt(gph)}</b> gold/h</span><span>Turu ${esc(state.version)} · up ${clock(state.uptimeSeconds)}</span>`;
  const main = $("#main");
  if (!list.length) {
    main.innerHTML = `<p class="empty">${state.bots.length ? "No bot matches the filter." : "No bots."}</p>`;
  } else if (view === "cards") {
    const groups = [["Running here", list.filter(b => b.online)], ["Offline", list.filter(b => !b.online)]].filter(g => g[1].length);
    main.innerHTML = groups.map(([t, l]) => `${groups.length > 1 ? `<h2 class="group">${t}</h2>` : ""}<div class="grid">${l.map(card).join("")}</div>`).join("");
  } else {
    main.innerHTML = table(list);
  }
  renderBulk();
  if ($("#detail").open) renderDetailHead();
}

function setLive(text, kind) { const l = $("#live"); l.textContent = text; l.className = `live ${kind}`; }
function notice(html) { const n = $("#notice"); n.hidden = !html; n.innerHTML = html || ""; }
function toast(text, bad) {
  const t = document.createElement("div");
  t.className = `toast${bad ? " bad" : ""}`;
  t.textContent = text;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3000);
}
function receive(text) {
  try { state = JSON.parse(text); } catch { return; }
  notice("");
  render();
}
function unauthorized() {
  setLive("Key needed", "warn");
  notice(key ? "The monitor key is wrong or was regenerated. <button type=\"button\" data-key>Enter the key</button>" : "This device needs the monitor key. <button type=\"button\" data-key>Enter the key</button>");
}

// The event stream is read with fetch, which can send the key in a header (EventSource can't).
let streamTry = 0;
async function stream() {
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: headers(), cache: "no-store" });
      if (r.status === 401) { unauthorized(); await waitForKey(); continue; }
      if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
      setLive("Live", "ok");
      streamTry = 0;
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let end;
        while ((end = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, end); buffer = buffer.slice(end + 2);
          const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trimStart()).join("\n");
          if (data && /^event: state$/m.test(block)) receive(data);
        }
      }
      throw new Error("closed");
    } catch {
      setLive("Reconnecting…", "warn");
      await new Promise(r => setTimeout(r, Math.min(10000, 1000 * 2 ** streamTry++)));
    }
  }
}
let keyWaiters = [];
const waitForKey = () => new Promise(r => keyWaiters.push(r));
function setKey(value) {
  key = value.trim();
  store.set(KEY, key || null);
  keyWaiters.splice(0).forEach(r => r());
}

// Commands -----------------------------------------------------------------------------------
let confirmResolve = null;
function confirmBox(title, text, ok = "OK") {
  $("#confirmTitle").textContent = title;
  $("#confirmText").textContent = text;
  $("#confirmOk").textContent = ok;
  $("#confirmDialog").returnValue = "";
  $("#confirmDialog").showModal();
  return new Promise(r => { confirmResolve = r; });
}
$("#confirmDialog").addEventListener("close", () => { confirmResolve?.($("#confirmDialog").returnValue === "ok"); confirmResolve = null; });

async function send(id, route) {
  const b = byId(id);
  const who = b?.snapshot?.name ?? b?.label ?? id;
  try {
    const r = await fetch(`/api/bots/${encodeURIComponent(id)}${route}`, { method: "POST", headers: headers() });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { unauthorized(); return false; }
    if (!r.ok) { toast(`${who}: ${body.error ?? `HTTP ${r.status}`}`, true); return false; }
    if (route === "/forget") { picked.delete(id); if (detailId === id) $("#detail").close(); }
    return true;
  } catch (e) {
    toast(`${who}: ${e.message}`, true);
    return false;
  }
}
async function act(id, route) {
  const b = byId(id);
  const entry = actionsFor(b, true).find(a => a[1] === route) || actionsFor(b, false).find(a => a[1] === route);
  const label = entry?.[0] ?? route;
  if (entry?.[2] && !await confirmBox(label, entry[2], label)) return;
  if (await send(id, route)) toast(`${b?.snapshot?.name ?? b?.label}: ${label}`);
  if (detailId === id) refreshDetail();
}
async function bulk(route) {
  const [label, , ok] = BULK.find(x => x[1] === route);
  const ids = [...picked].filter(id => { const b = byId(id); return b && ok(b); });
  if (!ids.length) return;
  if (route !== "/script/start" && !await confirmBox(`${label} ${ids.length} bot${ids.length > 1 ? "s" : ""}?`, ids.map(id => byId(id)?.snapshot?.name ?? id).join(", "), label)) return;
  const results = await Promise.all(ids.map(id => send(id, route)));
  const done = results.filter(Boolean).length;
  toast(`${label}: ${done} of ${ids.length} done`, done < ids.length);
}

// Details -------------------------------------------------------------------------------------
let detailId = null, detailTab = "events", detail = null, logKind = "script", logNext = 0, detailTimer = null;
function openDetail(id) {
  detailId = id; detail = null; logNext = 0; logKind = "script";
  $("#dPane").innerHTML = `<p class="empty">Loading…</p>`;
  renderDetailHead();
  $("#detail").showModal();
  refreshDetail();
  clearInterval(detailTimer);
  detailTimer = setInterval(refreshDetail, 2000);
}
$("#detail").addEventListener("close", () => { clearInterval(detailTimer); detailId = null; });
function renderDetailHead() {
  const b = byId(detailId);
  if (!b) return;
  const [label, kind] = status(b);
  $("#dChip").textContent = chip(b);
  $("#dTitle").textContent = b.snapshot?.name ?? b.label;
  $("#dPill").className = `pill ${kind}`;
  $("#dPill").textContent = label;
  const acts = actionsFor(b, true);
  const s = b.snapshot;
  const canJoin = control() && b.online && s && ["playing", "dead"].includes(s.state);
  const join = canJoin ? `<span class="spacer"></span><input type="text" id="dMap" placeholder="map-room" aria-label="Map"><input type="text" id="dCell" placeholder="Cell" aria-label="Cell" style="width:80px"><button type="button" data-join>Join</button>` : "";
  const controls = $("#dControls");
  // Keep what's typed in the join boxes.
  const typed = ["dMap", "dCell"].map(i => document.getElementById(i)?.value ?? "");
  const html = buttons(b, acts, "") + join || `<span class="when">${control() ? "Nothing to do while it's offline." : "Allow Control is off in Turu (Options > Application > Monitor)."}</span>`;
  if (controls.dataset.html !== html) {
    controls.dataset.html = html;
    controls.innerHTML = html;
    ["dMap", "dCell"].forEach((i, n) => { const el = document.getElementById(i); if (el) el.value = typed[n]; });
  }
  $("#dTabs").innerHTML = [["events", "Events"], ["log", "Log"], ["history", "History"]]
    .map(([t, l]) => `<button type="button" role="tab" class="small ${t === detailTab ? "on" : ""}" aria-selected="${t === detailTab}" data-dtab="${t}">${l}</button>`).join("");
}
async function refreshDetail() {
  const id = detailId;
  if (!id) return;
  try {
    const r = await fetch(`/api/bots/${encodeURIComponent(id)}`, { headers: headers(), cache: "no-store" });
    if (!r.ok) { if (r.status === 404) $("#dPane").innerHTML = `<p class="empty">This bot is gone.</p>`; return; }
    detail = await r.json();
  } catch { return; }
  if (id !== detailId) return;
  renderDetailHead();
  if (detailTab === "events") renderEvents();
  else if (detailTab === "history") renderHistory();
  else await pollLog();
}
function renderEvents() {
  const list = [...(detail?.events ?? [])].reverse();
  $("#dPane").innerHTML = list.length ? `<ul class="events">${list.map(eventRow).join("")}</ul>` : `<p class="empty">No events yet.</p>`;
}
function renderLogFrame() {
  $("#dPane").innerHTML = `<div class="d-tabs" style="margin-bottom:8px">${["script", "debug"].map(k => `<button type="button" class="small ${k === logKind ? "on" : ""}" data-log="${k}">${k === "script" ? "Script log" : "Debug log"}</button>`).join("")}</div><div class="log" id="dLog" tabindex="0" aria-label="Log"></div>`;
}
async function pollLog() {
  const b = byId(detailId);
  if (!b?.online) { $("#dPane").innerHTML = `<p class="empty">The log is only there while the bot runs.</p>`; return; }
  if (!document.getElementById("dLog")) { renderLogFrame(); logNext = 0; }
  try {
    const r = await fetch(`/api/bots/${encodeURIComponent(detailId)}/log?type=${logKind}&since=${logNext}`, { headers: headers(), cache: "no-store" });
    if (!r.ok) return;
    const { lines, next } = await r.json();
    const box = document.getElementById("dLog");
    if (!box) return;
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 20;
    if (logNext === 0) box.textContent = "";
    for (const l of lines) box.append(`${new Date(l.time).toLocaleTimeString()}  ${l.text}\n`);
    logNext = next;
    if (atEnd) box.scrollTop = box.scrollHeight;
  } catch {}
}
function spark(points, field, color) {
  const w = 600, h = 80;
  const vs = points.map(p => p[field]);
  const min = Math.min(...vs), max = Math.max(...vs), span = max - min || 1;
  const t0 = points[0].at, t1 = points.at(-1).at, dt = t1 - t0 || 1;
  const d = points.map((p, i) => `${i ? "L" : "M"}${((p.at - t0) / dt * w).toFixed(1)},${(h - 4 - (p[field] - min) / span * (h - 8)).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${field} over time"><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function renderHistory() {
  const pts = detail?.history ?? [];
  if (pts.length < 2) { $("#dPane").innerHTML = `<p class="empty">History builds up a point a minute while the bot plays and someone watches (or Army polls it).</p>`; return; }
  const hours = (pts.at(-1).at - pts[0].at) / 3600000;
  const rate = f => hours > 0 ? fmt(Math.round((pts.at(-1)[f] - pts[0][f]) / hours)) : "-";
  const fig = (title, f, color, priv) => `<figure><figcaption><span>${title}</span><span>${rate(f)}/h · now <b class="${priv ? "priv" : ""}">${fmt(pts.at(-1)[f])}</b></span></figcaption>${spark(pts, f, color)}</figure>`;
  $("#dPane").innerHTML = `<div class="chart">${fig("Gold", "gold", "var(--warn)", true)}${fig("XP", "xp", "var(--mp)")}${fig("Kills", "kills", "var(--ok)")}${fig("Drops", "drops", "var(--accent)")}</div><p class="when" style="margin:8px 0 0">${time(pts[0].at)} – ${time(pts.at(-1).at)}, ${pts.length} points</p>`;
}

// Wiring --------------------------------------------------------------------------------------
$("#filter").addEventListener("input", render);
$("#views").addEventListener("click", e => {
  const v = e.target.closest("[data-view]")?.dataset.view;
  if (v) { view = v; sort = { col: null, dir: 1 }; store.set("turu-monitor-view", v); render(); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button, th[data-col]");
  if (!t) return;
  if (t.dataset.col != null) { const c = +t.dataset.col; sort = { col: c, dir: sort.col === c ? -sort.dir : 1 }; render(); }
  else if (t.dataset.open) openDetail(t.dataset.open);
  else if (t.dataset.act) act(t.dataset.id, t.dataset.act);
  else if (t.dataset.bulk === "clear") { picked.clear(); render(); }
  else if (t.dataset.bulk) bulk(t.dataset.bulk);
  else if (t.dataset.dtab) { detailTab = t.dataset.dtab; logNext = 0; $("#dPane").innerHTML = ""; renderDetailHead(); refreshDetail(); }
  else if (t.dataset.log) { logKind = t.dataset.log; logNext = 0; renderLogFrame(); pollLog(); }
  else if (t.dataset.join != null) {
    const map = $("#dMap").value.trim(), cell = $("#dCell").value.trim();
    if (!map) { $("#dMap").focus(); return; }
    act(detailId, `/map/join?map=${encodeURIComponent(map)}${cell ? `&cell=${encodeURIComponent(cell)}` : ""}`);
  }
  else if (t.dataset.key != null) openKey();
});
$("#main").addEventListener("change", e => {
  const id = e.target.dataset?.pick;
  if (id == null) return;
  e.target.checked ? picked.add(id) : picked.delete(id);
  render();
});
$("#main").addEventListener("toggle", e => {
  const d = e.target;
  if (d.matches?.("details[data-id]")) {
    openSections.set(d.dataset.id, d.open);
    store.set("turu-monitor-sections", JSON.stringify(Object.fromEntries(openSections)));
  }
}, true);
$("#dClose").addEventListener("click", () => $("#detail").close());
const streamer = store.get("turu-monitor-streamer") === "1";
document.body.classList.toggle("streamer", streamer);
$("#streamer").classList.toggle("on", streamer);
$("#streamer").setAttribute("aria-pressed", streamer);
$("#streamer").addEventListener("click", () => {
  const on = document.body.classList.toggle("streamer");
  $("#streamer").classList.toggle("on", on);
  $("#streamer").setAttribute("aria-pressed", on);
  store.set("turu-monitor-streamer", on ? "1" : "0");
});
const openKey = () => { $("#keyInput").value = key; $("#keyDialog").showModal(); };
$("#keyButton").addEventListener("click", openKey);
$("#keyDialog").addEventListener("close", () => { if ($("#keyDialog").returnValue === "save") setKey($("#keyInput").value); });

render();
stream();
</script>
</body>
</html>
