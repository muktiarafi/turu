<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#141936" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<title>Turu Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath fill='%237C6CF0' d='M73.34 16H182.66C211.33 16 240 44.67 240 73.34V182.66C240 211.33 211.33 240 182.66 240H73.34C44.67 240 16 211.33 16 182.66V73.34C16 44.67 44.67 16 73.34 16Z'/%3E%3Cpath fill='%23fff' d='M34 112A46 46 0 0 0 126 112A14 14 0 0 0 98 112A18 18 0 0 1 62 112A14 14 0 0 0 34 112ZM130 112A46 46 0 0 0 222 112A14 14 0 0 0 194 112A18 18 0 0 1 158 112A14 14 0 0 0 130 112Z'/%3E%3C/svg%3E">
<style>
/* Nila: an indigo-dyed field, mori-cream ink, soga brown for what you act on.
   State dyes: jade (playing), kunyit (degraded), mengkudu (trouble). */
:root {
  --ground: #0e1226; --field: #141936; --raise: #1c2248; --sunk: #0a0d1e;
  --rule: #2a3266; --rule-soft: #1f2651;
  --ink: #eee6d3; --ink-2: #b5b4cc; --ink-3: #8d91b5;
  --soga: #d8995e; --soga-hover: #e4aa72; --soga-ink: #1d1307; --soga-soft: rgb(216 153 94 / .14);
  --jade: #7fd3a7; --kunyit: #ebc55c; --mengkudu: #ef6f63;
  --hp: var(--jade); --mp: #93a6ff; --tg: var(--mengkudu);
  --wax: #eee6d3; --wax-dim: #343d78;
  --shadow: 0 10px 30px rgb(3 5 15 / .5);
  --r: 8px; --r-sm: 6px;
  --top: 56px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #e4e7f2; --field: #f6f7fb; --raise: #eaecf5; --sunk: #ffffff;
    --rule: #cdd2e5; --rule-soft: #dee1ee;
    --ink: #161b3d; --ink-2: #474b70; --ink-3: #575c80;
    --soga: #985321; --soga-hover: #84461a; --soga-ink: #fff8ee; --soga-soft: rgb(152 83 33 / .11);
    --jade: #1b7449; --kunyit: #855e00; --mengkudu: #b3302a;
    --mp: #3346b0;
    --wax: #1d2350; --wax-dim: #c6cbe0;
    --shadow: 0 10px 30px rgb(22 27 61 / .16);
  }
}
:root[data-theme="light"] {
  --ground: #e4e7f2; --field: #f6f7fb; --raise: #eaecf5; --sunk: #ffffff;
  --rule: #cdd2e5; --rule-soft: #dee1ee;
  --ink: #161b3d; --ink-2: #474b70; --ink-3: #575c80;
  --soga: #985321; --soga-hover: #84461a; --soga-ink: #fff8ee; --soga-soft: rgb(152 83 33 / .11);
  --jade: #1b7449; --kunyit: #855e00; --mengkudu: #b3302a;
  --mp: #3346b0;
  --wax: #1d2350; --wax-dim: #c6cbe0;
  --shadow: 0 10px 30px rgb(22 27 61 / .16);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--ground); scrollbar-color: var(--rule) transparent; }
body {
  background: var(--ground); color: var(--ink); min-height: 100vh;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
::selection { background: var(--soga); color: var(--soga-ink); }
a { color: var(--soga); text-underline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--soga); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Controls ------------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 32px; padding: 0 12px; border-radius: var(--r-sm);
  background: transparent; border: 1px solid var(--rule); color: var(--ink);
  cursor: pointer; white-space: nowrap; font-weight: 500;
  transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out;
}
.btn:hover { background: var(--raise); border-color: color-mix(in srgb, var(--ink) 22%, var(--rule)); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; transform: none; background: transparent; }
.btn.primary { background: var(--soga); border-color: var(--soga); color: var(--soga-ink); }
.btn.primary:hover { background: var(--soga-hover); border-color: var(--soga-hover); }
.btn.danger { color: var(--mengkudu); border-color: color-mix(in srgb, var(--mengkudu) 40%, var(--rule)); }
.btn.danger:hover { background: color-mix(in srgb, var(--mengkudu) 12%, transparent); }
.btn.icon { width: 32px; padding: 0; }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { border-color: var(--rule); }
.btn[aria-pressed="true"] { background: var(--soga-soft); border-color: color-mix(in srgb, var(--soga) 55%, var(--rule)); color: var(--soga); }
.btn.busy { pointer-events: none; opacity: .6; }
input[type=text], input[type=password], input[type=search], input[type=number], select {
  height: 34px; padding: 0 10px; min-width: 0;
  background: var(--sunk); border: 1px solid var(--rule); border-radius: var(--r-sm);
  transition: border-color .15s ease-out;
}
input::placeholder { color: var(--ink-3); }
input:hover { border-color: color-mix(in srgb, var(--ink) 22%, var(--rule)); }
input:focus-visible { outline: none; border-color: var(--soga); box-shadow: 0 0 0 3px var(--soga-soft); }
input[type=checkbox] {
  appearance: none; flex: none; display: grid; place-content: center; width: 16px; height: 16px; margin: 0; cursor: pointer;
  background: var(--sunk); border: 1px solid color-mix(in srgb, var(--ink) 28%, var(--rule)); border-radius: 4px;
  transition: background-color .15s ease-out, border-color .15s ease-out;
}
input[type=checkbox]:hover { border-color: var(--soga); }
input[type=checkbox]:checked { background: var(--soga); border-color: var(--soga); }
input[type=checkbox]:checked::after { content: ""; width: 9px; height: 5px; border: solid var(--soga-ink); border-width: 0 0 2px 2px; rotate: -45deg; translate: 0 -1px; }
input[type=checkbox]:focus-visible { outline: 2px solid var(--soga); outline-offset: 2px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunk); border: 1px solid var(--rule-soft); border-radius: 9px; }
.seg button {
  min-height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent;
  color: var(--ink-2); cursor: pointer; font-weight: 500; white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .25); }
@media (pointer: coarse) {
  .btn { min-height: 40px; }
  .btn.icon { width: 40px; }
  .seg button { min-height: 36px; }
  input[type=text], input[type=password], input[type=search], input[type=number], select { height: 40px; }
  input[type=checkbox] { width: 20px; height: 20px; }
}

/* Top bar -------------------------------------------------------------------------------- */
.top {
  position: sticky; top: 0; z-index: 10; height: var(--top);
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  background: var(--field); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.brand span { color: var(--ink-2); font-weight: 500; }
.night { margin: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.night b { color: var(--ink); font-weight: 600; }
.night b.bad { color: var(--mengkudu); }
.night .sep { color: var(--ink-3); margin: 0 6px; }
.spacer { flex: 1; }
.meta { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.update { font-size: 12px; font-weight: 600; text-decoration: none; padding: 3px 9px; border-radius: 99px; background: var(--soga-soft); white-space: nowrap; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.live.ok::before { background: var(--jade); }
.live.warn::before { background: var(--kunyit); }
.tools { display: flex; gap: 4px; }

/* Page ----------------------------------------------------------------------------------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); }
main { padding: 16px 20px 96px; min-width: 0; }
.notice {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 0 0 16px; padding: 10px 14px; border-radius: var(--r);
  background: color-mix(in srgb, var(--kunyit) 10%, var(--field)); border: 1px solid color-mix(in srgb, var(--kunyit) 35%, var(--rule));
}
.notice[hidden] { display: none; }

.attention {
  margin: 0 0 20px; border-radius: var(--r); overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--mengkudu) 38%, var(--rule));
  background: color-mix(in srgb, var(--mengkudu) 7%, var(--field));
}
.attention[hidden] { display: none; }
.attention h2 { margin: 0; padding: 10px 14px 4px; font-size: 13px; font-weight: 650; color: var(--mengkudu); }
.attention ul { list-style: none; margin: 0; padding: 0 0 4px; }
.attention li { display: flex; align-items: center; gap: 12px; padding: 7px 14px; min-width: 0; }
.attention li + li { border-top: 1px solid color-mix(in srgb, var(--mengkudu) 16%, var(--rule-soft)); }
.attention .who { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attention .why { color: var(--ink-2); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attention .acts { display: flex; gap: 6px; flex: none; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 0 0 14px; }
.search { position: relative; flex: 1 1 200px; max-width: 320px; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; padding-left: 32px; }
.totals { margin-left: auto; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.totals b { color: var(--ink); font-weight: 600; }

/* Roster --------------------------------------------------------------------------------- */
.roster { container-type: inline-size; }
.group { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 6px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
.group:first-child { margin-top: 0; }
.group small { font-weight: 500; color: var(--ink-3); }
.group::after { content: ""; flex: 1; border-top: 1px solid var(--rule-soft); translate: 0 -3px; }
.sheet { background: var(--field); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.row, .rowhead {
  display: grid; align-items: center; column-gap: 14px; padding: 9px 14px;
  grid-template-columns: 20px 112px minmax(130px, 1.3fr) minmax(120px, 1.1fr) minmax(120px, 1fr) 96px 80px minmax(132px, 168px) 108px;
  grid-template-areas: "pick state who script where vitals rate trace acts";
}
.rowhead { padding-block: 7px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--sunk) 40%, var(--field)); }
.rowhead > span { font: inherit; color: inherit; }
.rowhead .rate, .row .rate { text-align: right; }
.row { border-top: 1px solid var(--rule-soft); cursor: pointer; transition: background-color .15s ease-out; min-height: 56px; }
.rowhead + .row, .sheet > .row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--raise) 70%, var(--field)); }
.row.picked { background: var(--soga-soft); }
.row[aria-current="true"] { background: var(--raise); }
.row[aria-current="true"] .name { color: var(--soga); }
.row.dim > :not(.acts):not(.pick) { opacity: .55; }
.pick { grid-area: pick; display: flex; }
.state { grid-area: state; display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 550; font-size: 13px; }
.state span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mark { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink-3); color: var(--ink-3); }
.ok > .mark, .mark.ok { background: var(--jade); color: var(--jade); }
.warn > .mark, .mark.warn { background: var(--kunyit); color: var(--kunyit); }
.bad > .mark, .mark.bad { background: var(--mengkudu); color: var(--mengkudu); }
.off > .mark, .mark.off { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.state.ok { color: var(--jade); } .state.warn { color: var(--kunyit); } .state.bad { color: var(--mengkudu); } .state.off { color: var(--ink-2); }
.state.changed .mark { animation: ping .9s cubic-bezier(.16, 1, .3, 1); }
@keyframes ping { from { box-shadow: 0 0 0 0 currentColor; } to { box-shadow: 0 0 0 9px transparent; } }
.cell2 { min-width: 0; display: grid; }
.cell2 > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell2 small { color: var(--ink-3); font-size: 12px; }
.who { grid-area: who; }
.name { font-weight: 600; font-size: 14px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
.name:hover { color: var(--soga); }
.script { grid-area: script; } .script b { font-weight: 500; } .script .none { color: var(--ink-3); }
.where { grid-area: where; }
.vitals { grid-area: vitals; display: grid; gap: 5px; }
.bar { height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; transition: width .4s cubic-bezier(.16, 1, .3, 1); }
.rate { grid-area: rate; } .rate b { font-weight: 600; }
.tracecell { grid-area: trace; min-width: 0; padding-left: 12px; }
.acts { grid-area: acts; display: flex; gap: 4px; justify-content: flex-end; }
.acts .btn.icon { width: 30px; min-height: 30px; }
@media (pointer: coarse) { .acts .btn.icon { width: 40px; min-height: 40px; } }

/* The trace: the last hour as 30 wax dots, two minutes each. */
.trace { display: flex; justify-content: space-between; align-items: center; height: 14px; }
.trace i { width: 3px; height: 3px; border-radius: 50%; background: var(--wax-dim); flex: none; }
.trace i.w { background: var(--wax); }
.trace i.p { background: color-mix(in srgb, var(--wax) 45%, var(--wax-dim)); }
.trace i.y { background: var(--kunyit); }
.trace i.r { background: var(--mengkudu); }
.trace i.m { width: 7px; height: 7px; }
.trace i.m.d { background: var(--soga); }
.trace i.m.s { background: transparent; box-shadow: inset 0 0 0 1.5px var(--wax); }
.trace i.now { position: relative; }
.trace i.now.w::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; background: var(--wax); opacity: 0; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: .35; transform: scale(1); } }
.trace.big { height: 24px; }
.trace.big i { width: 5px; height: 5px; }
.trace.big i.m { width: 11px; height: 11px; }
.trace.big i.now.w::after { inset: -5px; }
.axis { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 11px; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) {
  .trace i.now.w::after, .state.changed .mark { animation: none; }
  .bar i { transition: none; }
}

@container (max-width: 1180px) {
  .row, .rowhead {
    grid-template-columns: 20px 108px minmax(130px, 1.4fr) minmax(120px, 1fr) 92px minmax(120px, 156px) 108px;
    grid-template-areas: "pick state who script vitals trace acts";
  }
  .where, .rate { display: none; }
  .who small .loc { display: inline; }
}
.who small .loc { display: none; }
@container (max-width: 760px) {
  .rowhead { display: none; }
  .row {
    grid-template-columns: 20px auto minmax(0, 1fr) auto;
    grid-template-areas: "pick who who acts" ". state script script" ". trace trace trace";
    column-gap: 10px; row-gap: 6px; padding: 12px 12px 12px 14px;
  }
  .row .state { font-size: 12px; }
  .vitals { display: none; }
  .row .script { display: flex; gap: 8px; align-items: baseline; }
  .row .script small { flex: none; }
  .row .script .st { display: none; }
}

.skeleton .row { cursor: default; }
.skeleton .row:hover { background: none; }
.skeleton i { display: block; height: 10px; border-radius: 5px; background: var(--rule-soft); }

table { width: 100%; border-collapse: collapse; }
.tablewrap { overflow-x: auto; }
th, td { padding: 10px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--rule-soft); }
th { font-size: 12px; font-weight: 550; color: var(--ink-3); background: color-mix(in srgb, var(--sunk) 40%, var(--field)); border-bottom-color: var(--rule); }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:hover { color: var(--ink); }
th button:focus-visible { outline: 2px solid var(--soga); outline-offset: 2px; border-radius: 3px; }
th[aria-sort] { color: var(--ink); }
th button svg.i { width: 12px; height: 12px; visibility: hidden; }
th[aria-sort] button svg.i { visibility: visible; }
th[aria-sort="descending"] button svg.i { rotate: 180deg; }
td.num, th.num { text-align: right; }
th.num button { flex-direction: row-reverse; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--raise) 60%, var(--field)); }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 550; }

.empty { padding: 48px 16px; text-align: center; color: var(--ink-2); }
.empty p { margin: 0 0 4px; }
.empty .lead { color: var(--ink); font-weight: 600; font-size: 15px; }
.empty .btn { margin-top: 12px; }

/* Selection bar -------------------------------------------------------------------------- */
.selbar {
  position: fixed; z-index: 15; left: 12px; right: 12px; bottom: max(16px, env(safe-area-inset-bottom));
  width: fit-content; margin-inline: auto;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
  padding: 8px 8px 8px 14px; border-radius: 10px;
  background: var(--raise); border: 1px solid var(--rule); box-shadow: var(--shadow);
}
.selbar[hidden] { display: none; }
.selbar .count { font-weight: 600; margin-right: 6px; }

/* Panel ---------------------------------------------------------------------------------- */
.panel { background: var(--field); border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.panel[hidden] { display: none; }
.panel:focus { outline: none; }
.scrim { display: none; }
@media (min-width: 1100px) {
  .layout.docked { grid-template-columns: minmax(0, 1fr) 440px; }
  .panel { position: sticky; top: var(--top); height: calc(100vh - var(--top)); }
}
@media (max-width: 1099.98px) {
  .panel { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); box-shadow: var(--shadow); }
  .scrim:not([hidden]) { display: block; position: fixed; inset: 0; z-index: 25; background: rgb(5 7 18 / .5); }
}
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--rule-soft); }
.p-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-head .sub { grid-column: 1; display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; min-width: 0; }
.p-head .sub span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-head .close { grid-row: 1 / span 2; grid-column: 2; align-self: start; }
.p-controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
.p-controls .note { color: var(--ink-3); font-size: 13px; }
.p-join { display: flex; gap: 6px; padding: 8px 16px 0; }
.p-join input:first-child { flex: 1; }
.p-join input:nth-child(2) { width: 84px; }
.p-tabs { padding: 14px 16px 0; }
.p-pane { padding: 14px 16px 24px; overflow: auto; flex: 1; min-height: 0; }
.p-pane section + section { margin-top: 20px; }
.p-pane h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.meters { display: grid; gap: 6px; }
.meter { position: relative; height: 22px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--rule-soft); overflow: hidden; }
.meter i { position: absolute; inset: 0 auto 0 0; opacity: .32; transition: width .4s cubic-bezier(.16, 1, .3, 1); }
.meter i::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: inherit; filter: saturate(1.4); opacity: 1; }
.meter em { position: relative; display: flex; justify-content: space-between; padding: 0 9px; font-style: normal; font-size: 12px; line-height: 20px; }
.meter em b { font-weight: 600; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
dl.facts dt { color: var(--ink-3); }
dl.facts dd { margin: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); }
.counts b { color: var(--ink); font-weight: 600; }
.gains { display: flex; gap: 20px; flex-wrap: wrap; color: var(--ink-2); }
.gains b { color: var(--ink); font-weight: 600; }
.lists { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.lists ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.lists li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lists .none { color: var(--ink-3); }
.tracebox p { margin: 8px 0 0; color: var(--ink-2); font-size: 13px; }
.events { list-style: none; margin: 0; padding: 0; display: grid; }
.events li { display: grid; grid-template-columns: auto 8px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule-soft); }
.events li:last-child { border-bottom: 0; }
.events .mark { translate: 0 -1px; }
.when { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.log {
  margin-top: 10px; height: min(60vh, 520px); overflow: auto; padding: 10px 12px;
  background: var(--sunk); border: 1px solid var(--rule-soft); border-radius: var(--r-sm);
  font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
}
.chart { display: grid; gap: 16px; }
.chart figure { margin: 0; }
.chart figcaption { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.chart figcaption b { color: var(--ink); font-weight: 600; }
.chart svg { display: block; width: 100%; height: 64px; overflow: visible; }

/* Script Options tab: the control API's /script/options as a form. */
.opts-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 16px; }
.opts-head b { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opts-head p { flex-basis: 100%; margin: 0; color: var(--ink-2); font-size: 13px; }
.opt-list { border: 1px solid var(--rule-soft); border-radius: var(--r-sm); overflow: hidden; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 170px); align-items: center; gap: 6px 14px; padding: 10px 12px; transition: background-color .15s ease-out; }
.opt + .opt { border-top: 1px solid var(--rule-soft); }
.opt.changed { background: var(--soga-soft); }
.opt label { font-weight: 550; }
.opt small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.opt input[type=text], .opt input[type=number], .opt select { width: 100%; }
.opt input[type=checkbox] { justify-self: end; }
.opt input:invalid { border-color: var(--mengkudu); }
.opt.bool { grid-template-columns: minmax(0, 1fr) auto; }
.opts-foot { position: sticky; bottom: -24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding: 12px 0 14px; background: var(--field); border-top: 1px solid var(--rule-soft); }
.opts-foot .when { margin-left: auto; }
@media (max-width: 420px) { .opt:not(.bool) { grid-template-columns: 1fr; } }

/* Dialogs and toasts --------------------------------------------------------------------- */
dialog {
  background: var(--field); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px;
  padding: 20px; width: min(420px, calc(100vw - 32px)); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgb(5 7 18 / .55); }
dialog h2 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
dialog p { color: var(--ink-2); margin: 0 0 14px; }
dialog input { width: 100%; }
dialog .row-end { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.toasts { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 8px; z-index: 40; max-width: calc(100vw - 32px); }
.toast {
  display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 10px;
  background: var(--raise); border: 1px solid var(--rule); box-shadow: var(--shadow);
  animation: rise .25s cubic-bezier(.16, 1, .3, 1);
}
@keyframes rise { from { opacity: 0; translate: 0 8px; } }
body.selecting .toasts { bottom: 84px; }

body.streamer .priv { filter: blur(6px); }

.mobile-night { display: none; margin: 0 0 12px; color: var(--ink-2); }
.mobile-night b { color: var(--ink); font-weight: 600; } .mobile-night b.bad { color: var(--mengkudu); }
.mobile-night .sep { color: var(--ink-3); margin: 0 6px; }
@media (max-width: 860px) {
  .meta { display: none; }
}
@media (max-width: 640px) {
  .top { padding: 0 12px; gap: 10px; }
  .brand span, .night { display: none; }
  main { padding: 12px 12px 112px; }
  .mobile-night { display: block; }
  .totals { margin-left: 0; width: 100%; }
  .search { max-width: none; }
  .lists { grid-template-columns: 1fr; }
  .attention li { flex-wrap: wrap; }
  .attention .who { flex: 1; }
  .attention .why { flex-basis: 100%; order: 2; white-space: normal; padding-left: 20px; }
  .attention .acts { order: 3; padding-left: 20px; }
}
</style>

<script>
"use strict";
// The bots come from GET /api/events; commands go to POST /api/bots/<id>/... (bot/src/monitor/server.rs).
const $ = s => document.querySelector(s);
const STALE_MS = 15000;
const KEY = "turu-monitor-key";
const SLOTS = 30, SLOT_MS = 120000; // the trace: the last hour, two minutes a dot
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
const clock = s => s == null ? "–" : `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const perHour = (n, s) => s >= 60 ? Math.round(n * 3600 / s) : null;
const ago = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : s < 172800 ? `${Math.round(s / 3600)}h` : `${Math.round(s / 86400)}d`; };
const time = at => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const short = at => new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const icon = (n, label) => `<svg class="i"${label ? ` aria-label="${label}"` : ' aria-hidden="true"'}><use href="#i-${n}"/></svg>`;
const plain = st => String(st ?? "").replace(/^\[|\]$/g, "");

// A link from Turu carries the key after "#key=": the browser never sends it to a server.
(() => {
  const m = location.hash.match(/key=([^&]+)/);
  if (m) {
    store.set(KEY, decodeURIComponent(m[1]));
    history.replaceState(null, "", location.pathname + location.search);
  }
})();
let key = store.get(KEY) || "";
let state = null, view = store.get("turu-monitor-view") || "roster";
if (view === "cards") view = "roster";
let sort = { col: null, dir: 1 };
const picked = new Set();
const seen = new Map();      // id -> Map(slot -> trace class), sampled while this page is open
const lastStatus = new Map(); // id -> status label, to mark a change
const headers = () => key ? { Authorization: `Bearer ${key}` } : {};
const control = () => state?.allowControl === true;
const byId = id => state?.bots.find(b => b.id === id);
const name = b => b.snapshot?.name ?? b.label;

const STATES = {
  playing: ["Playing", "ok"], dead: ["Dead", "bad"], loading: ["Loading", "warn"],
  loggedOut: ["Logged out", "off"], notLoaded: ["Game not loaded", "off"],
};
function status(b) {
  const s = b.snapshot;
  if (!b.online) return [b.lastSeen ? `Offline · ${ago(state.now - b.lastSeen)}` : "Offline", "off"];
  if (!s) return [b.kind === "army" ? "Starting…" : "Waiting…", "off"];
  if (b.kind === "tab" && state.now - s.sampledAt > STALE_MS) return ["Not responding", "bad"];
  if (s.relogging) return ["Relogging", "warn"];
  if (s.script.status === "[Error]") return ["Script error", "bad"];
  const [label, kind] = STATES[s.state] || [s.state, "off"];
  if (s.state === "playing" && s.auto && !s.script.running) return [s.auto, kind];
  if (s.state === "playing" && s.script.running) return s.script.status === "[Paused]" ? ["Paused", "warn"] : ["Running", "ok"];
  if (s.state === "playing") return ["Idle", "ok"];
  return [label, kind];
}
const isLive = s => s && ["playing", "dead", "loading"].includes(s.state);
const stale = b => b.online && b.kind === "tab" && b.snapshot && state.now - b.snapshot.sampledAt > STALE_MS;
// Where a bot runs: its tab, Army client, or a past run. Rows sit under their machine's heading.
function where(b, withMachine = false) {
  const m = withMachine && b.machine ? `${b.machine} · ` : "";
  if (b.kind === "offline") return `${m}Last run`;
  return m + (b.id.includes("army:") ? `Army · ${b.label}` : b.label);
}
const mapHtml = map => { const m = (map || "").match(/^(.*?)(-\d+)$/); return m ? `${esc(m[1])}<span class="priv">${esc(m[2])}</span>` : esc(map || "–"); };

// What needs the user, and the one button that fixes it: [reason, [label, route, icon] | null].
function trouble(b) {
  if (!b.online) return null;
  const s = b.snapshot;
  if (stale(b)) return [`Hasn't answered for ${ago(state.now - s.sampledAt)}. The game may be frozen.`, null];
  if (!s) return null;
  if (s.script.status === "[Error]") return [`${s.script.name ?? "The script"} stopped with an error.`, s.state === "playing" && s.script.name ? [`Restart`, "/script/start", "play"] : null];
  if (s.state === "loggedOut" && !s.relogging) return ["Logged out, and Auto Relogin isn't bringing it back.", ["Log in", "/login", "login"]];
  return null;
}

// The trace ----------------------------------------------------------------------------------
function sample() {
  const slot = Math.floor(state.now / SLOT_MS);
  for (const b of state.bots) {
    const s = b.snapshot, [, kind] = status(b);
    let c = "";
    if (b.online && s) {
      if (kind === "bad") c = "r";
      else if (s.relogging || s.state === "loading") c = "y";
      else if (s.script.running) c = s.script.status === "[Paused]" ? "p" : "w";
      else if (s.auto) c = "w";
    }
    if (!seen.has(b.id)) seen.set(b.id, new Map());
    const m = seen.get(b.id);
    // Trouble outlasts a good sample in the same two minutes.
    if (!(m.get(slot) === "r" && c !== "r")) m.set(slot, c);
    for (const k of m.keys()) if (k < slot - SLOTS) m.delete(k);
  }
  for (const id of seen.keys()) if (!byId(id)) seen.delete(id);
}
const MARK = { drop: "d", death: "r", scriptError: "r", connectionLost: "r", relogin: "y", logout: "y", scriptOptions: "y", scriptStarted: "s", login: "s" };
const RANK = { r: 3, d: 2, y: 1, s: 0 };
function traceData(b) {
  const s = b.snapshot, now = state.now, end = Math.floor(now / SLOT_MS);
  const m = seen.get(b.id);
  const runFrom = b.online && s?.script.running && s.stats.runSeconds != null ? now - s.stats.runSeconds * 1000 : null;
  const marks = new Map();
  let drops = 0, deaths = 0, troubles = 0;
  for (const e of b.recent ?? []) {
    const i = SLOTS - 1 - (end - Math.floor(e.at / SLOT_MS));
    if (i < 0 || i >= SLOTS) continue;
    const c = MARK[e.kind];
    if (!c) continue;
    if (e.kind === "drop") drops++; else if (e.kind === "death") deaths++; else if (c === "r") troubles++;
    if (!marks.has(i) || RANK[c] > RANK[marks.get(i)]) marks.set(i, c);
  }
  const dots = [];
  let ran = 0;
  for (let i = 0; i < SLOTS; i++) {
    const slot = end - (SLOTS - 1 - i);
    let c = m?.has(slot) ? m.get(slot) : (runFrom != null && (slot + 1) * SLOT_MS > runFrom ? "w" : "");
    if (c === "w" || c === "p") ran++;
    dots.push([c, marks.get(i)]);
  }
  return { dots, ran, drops, deaths, troubles, running: !!(b.online && (s?.script.running || s?.auto)) };
}
function trace(b, big = false) {
  const t = traceData(b);
  const said = [`ran ${t.ran * 2} of the last 60 minutes`, t.drops && `${t.drops} drop${t.drops > 1 ? "s" : ""}`, t.deaths && `${t.deaths} death${t.deaths > 1 ? "s" : ""}`, t.troubles && `${t.troubles} problem${t.troubles > 1 ? "s" : ""}`].filter(Boolean).join(", ");
  const dots = t.dots.map(([c, mk], i) => {
    const cls = [mk ? `m ${mk}` : c, i === SLOTS - 1 && t.running ? "now" : "", i === SLOTS - 1 && t.running && !mk ? "w" : ""].filter(Boolean).join(" ");
    return `<i${cls ? ` class="${cls}"` : ""}></i>`;
  }).join("");
  return { html: `<div class="trace${big ? " big" : ""}" role="img" aria-label="Last hour: ${said}" title="Last hour: ${said}">${dots}</div>`, said, t };
}

// The buttons a bot gets: [label, route, confirm text or null, style, icon].
function actionsFor(b, full) {
  if (!control()) return [];
  if (!b.online) return b.kind === "tab" ? [] : [["Forget", "/forget", `Forget ${name(b)}? Its saved events and history go too.`, "danger", "trash"]];
  const s = b.snapshot, list = [];
  if (s?.script.running) {
    list.push(s.script.status === "[Paused]" ? ["Resume", "/script/resume", null, "", "play"] : ["Pause", "/script/pause", null, "", "pause"]);
    list.push(["Stop", "/script/stop", `Stop ${s.script.name ?? "the script"} on ${s.name}?`, "danger", "stop"]);
  } else if (s?.script.name && !s.auto) {
    list.push([`Start ${s.script.name}`, "/script/start", null, "primary", "play"]);
  }
  if (s?.auto) list.push([`Stop ${s.auto}`, "/auto/stop", null, "danger", "stop"]);
  else if (full && s?.state === "playing" && !s.script.running) list.push(["Auto Attack", "/auto/attack/start", null, "", "sword"]);
  if (full) {
    if (s && s.state !== "loggedOut" && s.state !== "notLoaded") {
      list.push(["Relogin", "/relogin", `Log ${s.name} out and back in?`, "", "relog"]);
      list.push(["House", "/house", null, "", "house"]);
      list.push(["Log out", "/logout", `Log ${s.name} out? Auto Relogin won't bring it back.`, "danger", "logout"]);
    } else if (s?.state === "loggedOut") {
      list.push(["Log in", "/login", null, "primary", "login"]);
    }
  }
  return list;
}
const button = (b, [label, route, , style, ic], compact) => compact
  ? `<button type="button" class="btn icon ${style === "primary" ? "primary" : style === "danger" ? "danger" : ""}" data-act="${esc(route)}" data-id="${esc(b.id)}" title="${esc(label)}" aria-label="${esc(label)} ${esc(name(b))}">${icon(ic)}</button>`
  : `<button type="button" class="btn ${style}" data-act="${esc(route)}" data-id="${esc(b.id)}">${icon(ic)}${esc(label)}</button>`;

// Roster rows: each cell is patched only when its markup changes, so focus and hover survive the stream.

// The event stream is read with fetch, which can send the key in a header (EventSource can't).
let streamTry = 0;
async function stream() {
  for (;;) {
    try {
      const r = await fetch("/api/events", { headers: headers(), cache: "no-store" });
      if (r.status === 401) { unauthorized(); await waitForKey(); continue; }
      if (!r.ok || !r.body) throw new Error(`HTTP ${r.status}`);
      setLive("Live", "ok");
      streamTry = 0;
      const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let end;
        while ((end = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, end); buffer = buffer.slice(end + 2);
          const data = block.split("\n").filter(l => l.startsWith("data:")).map(l => l.slice(5).trimStart()).join("\n");
          if (data && /^event: state$/m.test(block)) receive(data);
        }
      }
      throw new Error("closed");
    } catch {
      setLive("Reconnecting…", "warn");
      await new Promise(r => setTimeout(r, Math.min(10000, 1000 * 2 ** streamTry++)));
    }
  }
}

// Answers the reply's body (truthy), or false after a toast saying why.
async function send(id, route, payload) {

    const init = { method: "POST", headers: headers() };

    const r = await fetch(`/api/bots/${encodeURIComponent(id)}${route}`, init);

    if (r.status === 401) { unauthorized(); return false; }
    if (!r.ok) { toast(`${who}: ${body.error ?? `HTTP ${r.status}`}`, true); return false; }

  const fix = trouble(b)?.[1];

  if (entry?.[2] && !await confirmBox(`${label}?`, entry[2], label, entry[3] === "danger")) return;
  el?.classList.add("busy");
  const reply = await send(id, route);

  const results = await Promise.all(ids.map(id => send(id, route)));

    const sess = s.session, gph = sess && perHour(sess.gold, sess.seconds), xph = sess && perHour(sess.xp, sess.seconds);
    const run = s.stats.runSeconds;
    const list = (title, items) => `<div><h3>${title} <span class="when">${items.length || ""}</span></h3>${items.length ? `<ul>${items.map(i => `<li title="${esc(i)}">${esc(i)}</li>`).join("")}</ul>` : `<span class="none">None</span>`}</div>`;
    html = `<section class="meters">${meter(s.hp.cur, s.hp.max, "var(--hp)", "HP")}${meter(s.mp.cur, s.mp.max, "var(--mp)", "MP")}${s.target && b.online ? meter(s.target.hp, s.target.maxHp, "var(--tg)", s.target.name) : ""}</section>
      ${traceBox}
      ${sess ? `<section><h3>This run</h3><div class="gains"><span>Gold <b class="priv">+${fmt(sess.gold)}</b>${gph != null ? ` · ${fmt(gph)}/h` : ""}</span><span>XP <b>+${fmt(sess.xp)}</b>${xph != null ? ` · ${fmt(xph)}/h` : ""}</span></div></section>` : ""}
      <section><h3>Counters</h3><p class="counts" style="margin:0">${[["kills", "kills"], ["drops", "drops"], ["questsCompleted", "quests"], ["deaths", "deaths"], ["relogins", "relogins"]].map(([k, l]) => `<span><b>${fmt(s.stats[k])}</b> ${l}</span>`).join("")}</p></section>
      <section><dl class="facts">
        <dt>Script</dt><dd>${esc(s.script.name ?? "None")}${s.script.running && run != null ? ` · ${clock(run)}` : ""}</dd>
        <dt>Map</dt><dd>${mapHtml(s.map)}</dd>
        <dt>Cell</dt><dd>${esc(s.cell)} · ${esc(s.pad)}</dd>
        <dt>Server</dt><dd>${esc(s.server || "–")}</dd>
        <dt>Level</dt><dd>${esc(s.level)}${s.class ? ` · ${esc(s.class)}` : ""}</dd>
        <dt>Gold</dt><dd class="priv">${fmt(s.gold)}</dd>
        <dt>AdventureCoins</dt><dd>${fmt(s.coins)}</dd>
        <dt>Inventory</dt><dd>${inv}</dd>
      </dl></section>
      <section class="lists">${list("Quests", s.quests)}${list("Equipment", s.equipment)}</section>`;
  }
  setHtml(pane, html);
}
const eventRow = e => `<li><span class="when">${time(e.at)}</span><span class="mark ${MARK[e.kind] === "r" ? "bad" : MARK[e.kind] === "y" ? "warn" : MARK[e.kind] === "d" ? "ok" : "off"}"></span><span>${esc(e.text)}</span></li>`;
function recentList(b) {
  return b.recent?.length ? `<section><h3>Recent</h3><ul class="events">${b.recent.slice(0, 5).map(eventRow).join("")}</ul></section>` : "";
}
async function refreshDetail() {
  const id = detailId;
  if (!id || detailTab === "overview") return;
  if (detailTab === "options") { syncOptions(); return; }
  try {
    const r = await fetch(`/api/bots/${encodeURIComponent(id)}`, { headers: headers(), cache: "no-store" });
    if (!r.ok) { if (r.status === 404) setHtml($("#pPane"), `<div class="empty"><p class="lead">This bot is gone.</p></div>`); return; }
    detail = await r.json();
  } catch { return; }
  if (id !== detailId) return;
  if (detailTab === "events") renderEvents();
  else if (detailTab === "history") renderHistory();
  else if (detailTab === "log") await pollLog();
}
function renderEvents() {
  const list = [...(detail?.events ?? [])].reverse();
  setHtml($("#pPane"), list.length ? `<ul class="events">${list.map(eventRow).join("")}</ul>` : `<div class="empty"><p class="lead">No events yet</p><p>Drops, deaths, relogins and script starts and stops land here.</p></div>`);
}
function renderLogFrame() {
  const pane = $("#pPane");
  pane.dataset.html = "";
  pane.innerHTML = `<div class="seg" role="tablist" aria-label="Log">${["script", "debug"].map(k => `<button type="button" role="tab" aria-selected="${k === logKind}" data-log="${k}">${k === "script" ? "Script log" : "Debug log"}</button>`).join("")}</div><div class="log" id="dLog" tabindex="0" aria-label="${logKind === "script" ? "Script log" : "Debug log"}"></div>`;
}
async function pollLog() {
  const b = byId(detailId);
  if (!b?.online) { setHtml($("#pPane"), `<div class="empty"><p class="lead">No log while it's offline</p><p>The log is only there while the bot runs.</p></div>`); return; }
  if (!document.getElementById("dLog")) { renderLogFrame(); logNext = 0; }
  try {
    const r = await fetch(`/api/bots/${encodeURIComponent(detailId)}/log?type=${logKind}&since=${logNext}`, { headers: headers(), cache: "no-store" });
    if (!r.ok) return;
    const { lines, next } = await r.json();
    const box = document.getElementById("dLog");
    if (!box) return;
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 20;
    if (logNext === 0) box.textContent = lines.length ? "" : "Nothing logged yet.";
    else if (lines.length && box.textContent === "Nothing logged yet.") box.textContent = "";
    for (const l of lines) box.append(`${new Date(l.time).toLocaleTimeString()}  ${l.text}\n`);
    logNext = next;
    if (atEnd) box.scrollTop = box.scrollHeight;
  } catch {}
}
function spark(points, field, color) {
  const w = 400, h = 64;
  const vs = points.map(p => p[field]);
  const min = Math.min(...vs), max = Math.max(...vs), span = max - min || 1;
  const t0 = points[0].at, t1 = points.at(-1).at, dt = t1 - t0 || 1;
  const xy = points.map(p => [((p.at - t0) / dt * w).toFixed(1), (h - 3 - (p[field] - min) / span * (h - 6)).toFixed(1)]);
  const line = xy.map(([x, y], i) => `${i ? "L" : "M"}${x},${y}`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${field} over time, ${fmt(min)} to ${fmt(max)}"><path d="${line}L${w},${h}L0,${h}Z" fill="${color}" opacity=".12"/><path d="${line}" fill="none" stroke="${color}" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function renderHistory() {
  const pts = detail?.history ?? [];
  if (pts.length < 2) { setHtml($("#pPane"), `<div class="empty"><p class="lead">No history yet</p><p>A point lands every minute while the bot plays and the monitor is open, or Army polls it.</p></div>`); return; }
  const hours = (pts.at(-1).at - pts[0].at) / 3600000;
  const rate = f => hours > 0 ? fmt(Math.round((pts.at(-1)[f] - pts[0][f]) / hours)) : "–";
  const fig = (title, f, color, priv) => `<figure><figcaption><span>${title} · ${rate(f)}/h</span><span>now <b class="${priv ? "priv" : ""}">${fmt(pts.at(-1)[f])}</b></span></figcaption>${spark(pts, f, color)}</figure>`;
  setHtml($("#pPane"), `<div class="chart">${fig("Gold", "gold", "var(--soga)", true)}${fig("XP", "xp", "var(--mp)")}${fig("Kills", "kills", "var(--jade)")}${fig("Drops", "drops", "var(--kunyit)")}</div><p class="when" style="margin:14px 0 0">${short(pts[0].at)} to ${short(pts.at(-1).at)}, ${pts.length} points</p>`);
}

// Script Options: GET/POST /api/bots/<id>/script/options (the control API's /script/options).
// Read once when the tab opens, after a save, and when another script is loaded while nothing
// is edited, so the 2 s refresh never throws away what's typed.
let opts = null, optsFor, optsBusy = false;
const edits = new Map(), optIds = new Map();
const optKey = (cat, n) => `${cat}\u0000${n}`;
const spaced = c => String(c).replaceAll("_", " ");
const fileName = p => String(p ?? "").split(/[\\/]/).pop();
function resetOptions() { opts = null; optsFor = undefined; edits.clear(); }
function syncOptions() {
  const b = byId(detailId);
  if (!b?.online) { resetOptions(); setHtml($("#pPane"), `<div class="empty"><p class="lead">No Script Options while it's offline</p><p>They're read from the bot while it runs.</p></div>`); return; }
  const script = b.snapshot?.script.name ?? null;
  if (!optsBusy && (optsFor === undefined || (optsFor !== script && !edits.size))) loadOptions(script);
  else if (opts) renderOptionsFoot();
}
async function loadOptions(script) {
  const id = detailId;
  optsBusy = true;
  try {
    const r = await fetch(`/api/bots/${encodeURIComponent(id)}/script/options`, { headers: headers(), cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (id !== detailId || detailTab !== "options") return;
    if (r.status === 401) { unauthorized(); return; }
    optsFor = script;
    edits.clear();
    if (!r.ok) { opts = null; setHtml($("#pPane"), `<div class="empty"><p class="lead">Couldn't read the Script Options</p><p>${esc(body.error ?? `HTTP ${r.status}`)}</p></div>`); return; }
    opts = body;
    renderOptions();
  } catch (e) {
    if (id === detailId) setHtml($("#pPane"), `<div class="empty"><p class="lead">Couldn't read the Script Options</p><p>${esc(e.message)}</p></div>`);
  } finally { optsBusy = false; }
}
function optControl(cat, o, locked) {
  const k = optKey(cat, o.name);
  if (!optIds.has(k)) optIds.set(k, optIds.size);
  const id = `opt-${optIds.get(k)}`, v = edits.has(k) ? edits.get(k) : o.value;
  const attrs = `id="${id}" data-cat="${esc(cat)}" data-name="${esc(o.name)}"${locked ? " disabled" : ""}`;
  let input;
  if (o.kind === "bool") input = `<input type="checkbox" ${attrs}${v ? " checked" : ""}>`;
  else if (o.kind === "int") input = `<input type="number" step="1" inputmode="numeric" required ${attrs} value="${esc(v)}">`;
  else if (o.kind === "choice") input = `<select ${attrs}>${o.choices.map(c => `<option value="${esc(c)}"${c === v ? " selected" : ""}>${esc(spaced(c))}</option>`).join("")}</select>`;
  else input = `<input type="text" ${attrs} value="${esc(v)}" autocomplete="off">`;
  const desc = o.description ? `<small>${esc(o.description)}</small>` : "";
  return `<div class="opt${o.kind === "bool" ? " bool" : ""}${edits.has(k) ? " changed" : ""}"><div><label for="${id}">${esc(o.displayName || o.name)}</label>${desc}</div>${input}</div>`;
}
function renderOptions() {
  const pane = $("#pPane");
  pane.dataset.html = "";
  if (opts.options === "none") {
    pane.innerHTML = `<div class="empty"><p class="lead">${opts.script ? `${esc(fileName(opts.script))} has no Script Options` : "No script is loaded"}</p><p>${opts.script ? "Nothing to set for this one." : "Load a script in Turu to see its options here."}</p></div>`;
    return;
  }
  const locked = !control(), saved = opts.options === "saved";
  const where = saved
    ? `Saved in ${esc(opts.file)}.`
    : `Nothing is saved in ${esc(opts.file)} yet, so a run without the Script Options window uses these defaults.`;
  const many = opts.categories.length > 1;
  const groups = opts.categories.map(c => `<section>${many ? `<h3>${esc(c.name === "Options" ? "Options" : spaced(c.name))}</h3>` : ""}<div class="opt-list">${c.options.map(o => optControl(c.name, o, locked)).join("")}</div></section>`).join("");
  pane.innerHTML = `<form id="optsForm" novalidate><div class="opts-head"><b>${esc(fileName(opts.script))}</b><span class="state ${saved ? "ok" : "warn"}"><span class="mark"></span><span>${saved ? "Saved" : "Defaults"}</span></span><p>${where}${locked ? " Control is off, so they can't be changed here: turn on Allow Control in Turu, Options › Application › Monitor." : ""}</p></div>${groups}<div class="opts-foot" id="optsFoot"></div></form>`;
  renderOptionsFoot();
}
function renderOptionsFoot() {
  const foot = document.getElementById("optsFoot");
  if (!foot || !opts) return;
  const locked = !control();
  const invalid = !!document.querySelector("#optsForm input:invalid");
  const n = edits.size;
  const running = byId(detailId)?.snapshot?.script.running;
  const note = invalid ? "A number is missing or not whole" : n ? `${n} change${n > 1 ? "s" : ""} not saved` : running ? "Most scripts read these when they start." : "";
  setHtml(foot, `<button type="button" class="btn" data-opts="reset"${locked ? " disabled" : ""}>Reset to defaults</button>${n ? `<button type="button" class="btn ghost" data-opts="discard">Discard</button>` : ""}<span class="when">${esc(note)}</span><button type="button" class="btn primary" data-opts="save"${locked || !n || invalid ? " disabled" : ""}>Save</button>`);
}
function editOption(el) {
  const { cat, name: n } = el.dataset;
  const o = opts?.categories.find(c => c.name === cat)?.options.find(o => o.name === n);
  if (!o) return;
  const raw = el.value.trim();
  const v = o.kind === "bool" ? el.checked : o.kind === "int" ? (/^-?\d+$/.test(raw) && Number.isSafeInteger(Number(raw)) ? Number(raw) : null) : el.value;
  if (o.kind === "int") el.setCustomValidity(v == null ? "A whole number" : "");
  const k = optKey(cat, n);
  if (v == null) edits.set(k, el.value); else if (v === o.value) edits.delete(k); else edits.set(k, v);
  el.closest(".opt")?.classList.toggle("changed", edits.has(k));
  renderOptionsFoot();
}
async function saveOptions(reset) {
  const id = detailId, b = byId(id), who = b ? name(b) : id;
  let payload, route = "/script/options";
  if (reset) {
    if (!await confirmBox("Reset to defaults?", `Put every Script Option of ${fileName(opts.script)} on ${who} back to its default, and save.`, "Reset", true)) return;
    route += "?reset=1";
  } else {
    payload = {};
    for (const [k, v] of edits) {
      const [cat, n] = k.split("\u0000");
      if (cat === "Options") payload[n] = v; else (payload[cat] ??= {})[n] = v;
    }
  }
  const reply = await send(id, route, payload);
  if (!reply || id !== detailId) return;
  edits.clear();
  opts = reply;
  toast(`${who}: Script Options ${reset ? "reset to the defaults" : "saved"}`);
  if (detailTab === "options") renderOptions();
}

// Wiring --------------------------------------------------------------------------------------
$("#filter").addEventListener("input", render);
$("#views").addEventListener("click", e => {
  const v = e.target.closest("[data-view]")?.dataset.view;
  if (v) { view = v; sort = { col: null, dir: 1 }; store.set("turu-monitor-view", v); $("#main").dataset.shape = ""; $("#main")._table = ""; render(); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) {
    // A click anywhere on a row (not on its controls) opens it.
    const row = e.target.closest(".row[data-row]");
    if (row && !e.target.closest("input")) openDetail(row.dataset.row);
    return;
  }
  if (t.dataset.col != null) { const c = +t.dataset.col; sort = { col: c, dir: sort.col === c ? -sort.dir : 1 }; render(); }
  else if (t.dataset.open) openDetail(t.dataset.open);
  else if (t.dataset.act) act(t.dataset.id, t.dataset.act, t);
  else if (t.dataset.bulk === "clear") { picked.clear(); render(); }
  else if (t.dataset.bulk) bulk(t.dataset.bulk);
  else if (t.dataset.dtab) {
    if (detailTab === "options" && t.dataset.dtab !== "options" && edits.size) toast("Unsaved Script Options changes were dropped.", true);
    detailTab = t.dataset.dtab; logNext = 0; resetOptions();
    $("#pPane").dataset.html = ""; $("#pPane").innerHTML = detailTab === "overview" ? "" : `<div class="empty"><p>Loading…</p></div>`;
    renderPanel(); refreshDetail();
  }
  else if (t.dataset.opts === "save") saveOptions(false);
  else if (t.dataset.opts === "reset") saveOptions(true);
  else if (t.dataset.opts === "discard") { edits.clear(); renderOptions(); }
  else if (t.dataset.log) { logKind = t.dataset.log; logNext = 0; renderLogFrame(); pollLog(); }
  else if (t.dataset.key != null) openKey();
  else if (t.dataset.clearFilter != null) { $("#filter").value = ""; render(); $("#filter").focus(); }
});
document.addEventListener("submit", e => {
  if (e.target.matches("#optsForm")) { e.preventDefault(); return; }
  if (!e.target.matches("[data-join]")) return;
  e.preventDefault();
  const map = $("#dMap").value.trim(), cell = $("#dCell").value.trim();
  if (!map) { $("#dMap").focus(); return; }
  act(detailId, `/map/join?map=${encodeURIComponent(map)}${cell ? `&cell=${encodeURIComponent(cell)}` : ""}`, e.target.querySelector("button"));
});
$("#main").addEventListener("change", e => {
  const id = e.target.dataset?.pick;
  if (id == null) return;
  e.target.checked ? picked.add(id) : picked.delete(id);
  render();
});
$("#pPane").addEventListener("input", e => { if (e.target.dataset?.cat != null) editOption(e.target); });
$("#pPane").addEventListener("change", e => { if (e.target.dataset?.cat != null) editOption(e.target); });
$("#pClose").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && detailId && !document.querySelector("dialog[open]")) closePanel();
  if (e.key === "/" && !e.target.closest("input, textarea") && !document.querySelector("dialog[open]")) { e.preventDefault(); $("#filter").focus(); }
});
function setStreamer(on) {
  document.body.classList.toggle("streamer", on);
  $("#streamer").setAttribute("aria-pressed", on);
  $("#streamer").innerHTML = icon(on ? "eyeoff" : "eye");
}
setStreamer(store.get("turu-monitor-streamer") === "1");
$("#streamer").addEventListener("click", () => {
  const on = !document.body.classList.contains("streamer");
  setStreamer(on);
  store.set("turu-monitor-streamer", on ? "1" : "0");
});
const openKey = () => { $("#keyInput").value = key; $("#keyDialog").showModal(); };
$("#keyButton").addEventListener("click", openKey);
$("#keyDialog").addEventListener("close", () => { if ($("#keyDialog").returnValue === "save") setKey($("#keyInput").value); });
render();
stream();
</script>
