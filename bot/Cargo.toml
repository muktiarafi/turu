[package]
name = "turu_bot"
description = "Turu: AQW bot engine (VibeSkua-compatible API, TypeScript scripts)"
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "6.0"
chrono = { workspace = true, features = ["clock"] }
regex = "1"
rquickjs = { version = "0.14", features = ["loader", "macro"] }
oxc = { version = "0.156", features = ["transformer", "codegen", "semantic"] }
# The server list (`bot.servers.getServers`); the desktop already builds it.
reqwest = { workspace = true, features = ["blocking"] }
# The control API (`control_api.rs`) and its token; reqwest already builds hyper and tokio.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { workspace = true, features = ["rt", "net", "time"] }
getrandom = "0.3"
# Search Scripts (`repo.rs`): checking downloads, and the repository zip.
sha2 = { workspace = true }
zip = { workspace = true, features = ["deflate"] }

# Account passwords (`accounts.rs`), in the system's keychain: Keychain, Credential Manager,
# the Secret Service (pure Rust on Linux: no libdbus to build against).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
