[package]
name = "ruffle_desktop"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
# AQW build: per-thread heaps instead of the contended Windows process heap.
mimalloc = { version = "0.1", default-features = false }
# AQW build: readable Rust symbol names in the heap census (see `heap_census`).
rustc-demangle = "0.1"
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
wgpu-core = "30.0.1"
clap_complete = { workspace = true, optional = true }
cpal = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true, default-features = false, features = ["image"] }
egui-wgpu = { workspace = true, features = ["winit"] }
image = { workspace = true, features = ["png"] }
egui-winit = { workspace = true }
fontdb = "0.23"
turu_bot = { path = "../bot" }
ruffle_core = { path = "../core", features = ["audio", "clap", "mp3", "aac", "nellymoser", "default_compatibility_rules", "egui"] }
ruffle_render = { path = "../render", features = ["clap"] }
ruffle_render_wgpu = { path = "../render/wgpu", features = ["clap"] }
ruffle_video_software = { path = "../video/software", optional = true }
ruffle_video_external = { path = "../video/external", features = ["openh264"], optional = true }
ruffle_frontend_utils = { path = "../frontend-utils", features = ["cpal", "fs", "navigator"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.5"
winit = "0.30.13"
webbrowser = "1.2.4"
# AQW build: Mugetsu's new-version check (already in the program for OpenH264's download).
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
url = { workspace = true }
dirs = "6.0"
rfd = { workspace = true }
anyhow = { workspace = true }
bytemuck = { workspace = true }
os_info = { version = "3", default-features = false }
unic-langid = "0.9.6"
sys-locale = "0.3.2"
wgpu = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
fluent-templates = { workspace = true }
toml_edit = { workspace = true, features = ["parse"] }
gilrs = "0.11"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs"] }

tracing-tracy = { version = "0.11.3", optional = true, features = ["demangle"] }
rand = { workspace = true, default-features = true }
thiserror.workspace = true
async-channel.workspace = true
unicode-bidi = "0.3.18"
memmap2.workspace = true
walkdir.workspace = true
async-task = "4.7.1"

[target.'cfg(unix)'.dependencies]
fontconfig = { version = "0.11.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.0", features = ["settings", "game_mode"] }

[target.'cfg(windows)'.dependencies]
# AQW build: DXGI, to see which graphics chip Mugetsu will use (see `mugetsu::intel_graphics`).
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Environment", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
vergen = { version = "10.0.3", features = ["build", "cargo"] }
vergen-gitcl = { version = "10.0.3" }
winresource = "0.1"

[package.metadata.winresource]
# https://learn.microsoft.com/en-us/windows/win32/menurc/stringfileinfo-block
# AQW build: Mugetsu is a modified build; its file details must not claim to be Ruffle LLC's
# official program (that also looks like impersonation to antivirus heuristics).
ProductName = "Mugetsu"
FileDescription = "Mugetsu player for AdventureQuest Worlds (modified Ruffle)"
CompanyName = "Mugetsu"
LegalCopyright = "Mugetsu; based on Ruffle, Copyright © 2018 Ruffle LLC and Ruffle contributors"
# Keep equal to `mugetsu::VERSION` (desktop/src/mugetsu.rs).
ProductVersion = "1.6.0"
FileVersion = "1.6.0 (Ruffle 0.7.0-nightly.2026.10.2)"
# InternalName should be the same as the module name
InternalName = "ruffle_desktop"
# The release ships this player as Mugetsu.exe.
OriginalFilename = "Mugetsu.exe"

[features]
default = ["software_video", "external_video", "lzma", "fontconfig", "freetype"]
shell-completions = ["dep:clap_complete"]
jpegxr = ["ruffle_core/jpegxr"]

# core features
avm_debug = ["ruffle_core/avm_debug"]
lzma = ["ruffle_core/lzma"]
software_video = ["ruffle_video_software"]
external_video = ["ruffle_video_external"]
tracy = ["tracing-tracy", "ruffle_render_wgpu/profile-with-tracy"]
tracy_images = ["tracy", "ruffle_render_wgpu/tracy_images"]
tracy_avm = ["tracy", "ruffle_core/tracy_avm"]
fontconfig = ["dep:fontconfig"]
fontconfig-dlopen = ["fontconfig", "fontconfig/dlopen"]
freetype = ["ruffle_frontend_utils/freetype"]

# wgpu features
render_debug_labels = ["ruffle_render_wgpu/render_debug_labels"]

# sandboxing
sandbox = []
