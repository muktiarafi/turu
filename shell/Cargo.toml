[package]
# Turu: the shells' logic without a window (docs/NATIVE_UI_PROPOSAL.md, L1's shell part). The
# desktop's (the `desktop` feature): starting and restarting the tabs' clients, the tab list, Grid
# View, the clients' pictures on the shell's GPU and the pacing protocol, the dialog queue,
# updates, Army launches and the monitor's peers; its window is a front over it
# (`app/src/shell.rs`: winit). Android's (`slots`): the tab list over the slots, carried out by the
# activity (`android/src/slot_shell.rs`). No winit, rfd or player here, and no egui of its own:
# `turu_frontend` is taken without `ruffle`.
name = "turu_shell"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
turu_bot = { path = "../bot", default-features = false }
turu_frontend = { path = "../frontend", default-features = false }
tracing = { workspace = true }
# The desktop shell's (the `desktop` feature): its GPU, links, and `TURU_SHELL_TEST`'s `dump` as a
# PNG.
wgpu = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
webbrowser = { version = "1.2.4", optional = true }
image = { workspace = true, features = ["png"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["desktop"]
# The desktop shell (`Shell`); Android's app takes only `slots`.
desktop = ["dep:wgpu", "dep:anyhow", "dep:webbrowser", "dep:image", "turu_frontend/gpu"]

# A client that says hello and its status, for the tests (`tests/shell.rs`): no player.
[[bin]]
name = "turu-shell-fake-client"
path = "src/bin/fake_client.rs"
test = false
doc = false

[[test]]
name = "shell"
required-features = ["desktop"]
