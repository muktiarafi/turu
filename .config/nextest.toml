# cargo-nextest, the test runner CI uses (`cargo nextest run`, ci.yml). It runs
# every test in its own process and the tests of every binary at once; tests no longer slow down
# the others of their file (butler's control API test: 8.5 s alone, 28 s beside its file's other
# tests). `cargo test` still works the same. bot/tests is one test binary (bot/tests/main.rs).

[profile.default]
# A test over 30 s is reported as slow; one still running after 2 minutes has hung and is killed.
slow-timeout = { period = "30s", terminate-after = 4 }

# Replaying a tape with combat takes about as long as it was recorded (docs/REPLAY_TESTS_PROPOSAL.md,
# decision 2): the CoreStory tape, about 2 minutes.
[[profile.default.overrides]]
filter = 'test(the_core_story_tape_replays)'
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failing test, not only the first.
fail-fast = false
# The engine's tests mostly wait on timers (about 30 s of CPU in a 60 s run with 4 at once), so
# CI's 4-core runner runs more of them than it has cores.
test-threads = 12
