# Versions follow ruffle-android's (https://github.com/ruffle-rs/ruffle-android).
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
sentry = "8.61.1"
# The one android-activity 0.6 is written against (its README); no prefab: it has its own glue.
gamesActivity = "4.4.0"
# GameActivity is an AppCompatActivity, and its POM names neither.
appcompat = "1.7.1"
core = "1.16.0"
# The Android shell's own screens (docs/NATIVE_UI_PROPOSAL.md, L5a). 2026.11.01: Compose 1.13 and
# Material 3 1.5.0 (Expressive's motion and emphasized type); needs compileSdk 37.1 (app only).
composeBom = "2026.11.01"
# BackHandler for the shell's panel (Back closes what's on top).
activityCompose = "1.12.4"
# The view models' types (generated by turu-typegen, L4) decode with it: the generator's version.
kotlinxSerialization = "1.9.0"
# The JVM tests (`src/test`): the generated types against the views Rust writes.
junit = "4.13.2"

[libraries]
sentryAndroid = { module = "io.sentry:sentry-android", version.ref = "sentry" }
gamesActivity = { module = "androidx.games:games-activity", version.ref = "gamesActivity" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core = { module = "androidx.core:core", version.ref = "core" }

composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeUi = { module = "androidx.compose.ui:ui" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeUiTooling = { module = "androidx.compose.ui:ui-tooling" }
composeUiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
# Material Symbols Rounded's core set (Icons.Rounded): Add, Close, Search, MoreVert, ...
activityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { module = "junit:junit", version.ref = "junit" }
composeIconsCore = { module = "androidx.compose.material:material-icons-core" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
